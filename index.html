<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WoW Forever (1.60.1) — Pre-BiS &amp; Dungeon Tracker</title>
<style>
  :root {
    /* Wowhead-sampled neutral dark grays */
    --bg: #101010;
    --surface: #181818;
    --surface-2: #202020;
    --surface-deep: #141414;
    --hover: #242424;
    --border: #2d2d2d;
    --border-strong: #3d3d3d;

    /* Crisp Wowhead foreground hierarchy */
    --text: #e6e6e6;
    --text-strong: #ffffff;
    --muted: #8f8f8f;
    --subtle: #666666;

    /* WoW Forever sampled steel-cerulean blues */
    --forever: #175b8c;
    --forever-hover: #1e6ea8;
    --forever-bright: #5db2e8;
    --forever-text: #8ccbf2;
    --forever-tint: rgba(23, 91, 140, 0.22);
    --forever-tint-soft: rgba(23, 91, 140, 0.12);
    --forever-border: #2874ab;

    /* Semantic tones */
    --success: #3fb950;
    --success-tint: rgba(63, 185, 80, 0.14);
    --danger: #d9534f;
    --danger-tint: rgba(217, 83, 79, 0.14);

    /* Boss type colors */
    --type-main: #c8c8c8;
    --type-final: #e06c75;
    --type-rare: #b77ced;
    --type-secret: #d97cb5;
    --type-summoned: #4ec2b4;
    --type-optional: #969696;
    --type-event: #78a9d6;

    --radius: 4px;
    --radius-sm: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 13.5px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.42;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px 0;
  }

  .wrap {
    max-width: 1380px;
    margin: 0 auto;
  }

  .title-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand-line {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .forever-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--forever);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--forever-border);
    user-select: none;
  }

  h1 {
    margin: 0;
    font-size: 1.22rem;
    font-weight: 700;
    color: var(--text-strong);
    letter-spacing: -0.1px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.81rem;
    margin-top: 3px;
  }

  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  /* Compact Character Switcher in Header */
  .char-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
    padding: 7px 10px;
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  .char-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }

  .faction-btn {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 4px 8px;
  }

  .faction-btn.horde {
    color: #e88388;
    background: rgba(217, 83, 79, 0.14);
    border-color: rgba(217, 83, 79, 0.38);
  }

  .faction-btn.alliance {
    color: var(--forever-text);
    background: var(--forever-tint);
    border-color: var(--forever-border);
  }

  /* Top-level Tabs */
  .main-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 12px;
  }

  .tab-btn {
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    padding: 8px 15px;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    position: relative;
    bottom: -1px;
    cursor: pointer;
  }

  .tab-btn:hover {
    color: var(--text-strong);
    background: var(--surface-2);
    border-color: var(--border-strong);
  }

  .tab-btn.active {
    background: var(--bg);
    color: var(--text-strong);
    border-color: var(--border);
    box-shadow: inset 0 2px 0 var(--forever);
  }

  .tab-count {
    background: var(--surface-2);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }

  .tab-btn.active .tab-count {
    background: var(--forever);
    color: #ffffff;
    border-color: var(--forever-border);
  }

  /* Form controls */
  button, select, input[type="search"], input[type="text"], input[type="url"] {
    font: inherit;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    outline: none;
    transition: border-color 0.12s, background 0.12s;
  }

  button {
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 500;
  }

  button:hover, select:hover, input:hover {
    border-color: var(--border-strong);
    background-color: var(--hover);
  }

  input:hover {
    background-color: var(--surface-deep);
  }

  button:focus, select:focus, input:focus {
    border-color: var(--forever-bright);
  }

  select:disabled, input:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    background: var(--surface-deep);
  }

  button.primary {
    background: var(--forever);
    border-color: var(--forever-border);
    color: #ffffff;
    font-weight: 600;
  }

  button.primary:hover {
    background: var(--forever-hover);
    border-color: var(--forever-bright);
  }

  button.danger {
    color: #ef8a87;
    border-color: rgba(217, 83, 79, 0.4);
    background: var(--danger-tint);
  }

  button.danger:hover {
    background: rgba(217, 83, 79, 0.24);
    border-color: var(--danger);
  }

  button.toggle-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  button.toggle-pill.active {
    background: var(--forever);
    border-color: var(--forever-border);
    color: #ffffff;
    font-weight: 600;
  }

  button.toggle-pill.active:hover {
    background: var(--forever-hover);
  }

  /* 3-State T0.5 Status Pill in Gear Builder */
  .t05-state-btn {
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 700;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    min-width: 62px;
    text-align: center;
  }

  .t05-state-btn.need_t0 {
    background: var(--surface-deep);
    color: var(--muted);
    border-color: var(--border-strong);
  }

  .t05-state-btn.have_t0 {
    background: var(--forever-tint);
    color: var(--forever-text);
    border-color: var(--forever-border);
  }

  .t05-state-btn.t05 {
    background: var(--success-tint);
    color: var(--success);
    border-color: rgba(63, 185, 80, 0.45);
  }

  /* Sticky Compendium Controls */
  .controls-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface-deep);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
  }

  .controls-grid {
    display: grid;
    grid-template-columns: minmax(220px, 2.2fr) minmax(190px, 1.3fr) minmax(150px, 1fr) minmax(185px, 1.1fr);
    gap: 6px;
    align-items: center;
  }

  .controls-row-2 {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
  }

  .segmented {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 2px;
    gap: 2px;
  }

  .segmented button {
    border: none;
    background: transparent;
    padding: 5px 10px;
    border-radius: 2px;
    color: var(--muted);
  }

  .segmented button:hover {
    color: var(--text);
    background: var(--surface-2);
  }

  .segmented button.active {
    background: var(--forever);
    color: #ffffff;
    font-weight: 600;
  }

  .inline-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }

  .stat-pill {
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px 9px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .stat-pill strong { color: var(--text-strong); }
  .stat-pill.accent strong { color: var(--forever-text); }
  .stat-pill.done strong { color: var(--success); }

  label.chk {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    padding: 4px 6px;
  }

  label.chk:hover { color: var(--text); }
  label.chk input[type="checkbox"] { accent-color: var(--forever); cursor: pointer; }

  main {
    padding: 14px 20px 48px;
  }

  /* Utilitarian rectangular tags */
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: var(--radius-sm);
    letter-spacing: 0.2px;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .origin-forever {
    background: var(--forever-tint);
    color: var(--forever-text);
    border-color: var(--forever-border);
  }

  .origin-classic {
    background: var(--surface-2);
    color: var(--muted);
    border-color: var(--border-strong);
  }

  .type-Main { background: var(--surface-2); color: var(--type-main); border-color: var(--border); }
  .type-Final { background: rgba(224, 108, 117, 0.14); color: var(--type-final); border-color: rgba(224, 108, 117, 0.35); }
  .type-Rare { background: rgba(183, 124, 237, 0.14); color: var(--type-rare); border-color: rgba(183, 124, 237, 0.35); }
  .type-Secret { background: rgba(217, 124, 181, 0.14); color: var(--type-secret); border-color: rgba(217, 124, 181, 0.35); }
  .type-Summoned { background: rgba(78, 194, 180, 0.14); color: var(--type-summoned); border-color: rgba(78, 194, 180, 0.32); }
  .type-Optional { background: var(--surface-deep); color: var(--type-optional); border-color: var(--border); }
  .type-Event { background: rgba(120, 169, 214, 0.14); color: var(--type-event); border-color: rgba(120, 169, 214, 0.32); }

  .accent-badge {
    background: var(--forever-tint);
    color: var(--forever-text);
    border-color: var(--forever-border);
  }

  .done-tag {
    background: var(--success-tint);
    color: var(--success);
    border-color: rgba(63, 185, 80, 0.35);
  }

  .t05-quest-tag {
    background: rgba(78, 194, 180, 0.16);
    color: var(--type-summoned);
    border: 1px solid rgba(78, 194, 180, 0.38);
    border-radius: 2px;
    padding: 0 5px;
    font-size: 11px;
    font-weight: 700;
  }

  .base-t0-tag {
    background: var(--surface-2);
    color: var(--forever-text);
    border: 1px solid var(--forever-border);
    border-radius: 2px;
    padding: 0 5px;
    font-size: 10.5px;
    font-weight: 600;
  }

  /* Panels */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 12px;
  }

  .gearset-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .bookmark-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .bookmark-row label {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
  }

  .bookmark-row input {
    flex: 1 1 320px;
    font-size: 0.82rem;
    background: var(--surface-deep);
  }

  a.link-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--forever-border);
    background: var(--forever);
    color: #ffffff;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }

  a.link-btn:hover { background: var(--forever-hover); }

  a.inline-link {
    color: var(--forever-text);
    text-decoration: none;
    font-size: 0.8rem;
    padding: 4px 7px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--forever-border);
    background: var(--forever-tint);
    white-space: nowrap;
  }

  a.inline-link:hover { background: var(--forever); color: #ffffff; }

  .item-cell-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 220px;
  }

  .item-editor-slot {
    flex: 1 1 auto;
    min-width: 0;
  }

  .item-cell-wrap input {
    width: 100%;
    padding: 5px 8px;
    font-size: 0.82rem;
    background: var(--surface-deep);
  }

  .item-display-btn {
    width: 100%;
    text-align: left;
    padding: 5px 8px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-strong);
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: text;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }

  .item-display-btn:hover {
    border-color: var(--forever-border);
    background: var(--surface-2);
  }

  .gear-table select {
    padding: 5px 7px;
    font-size: 0.82rem;
    width: 100%;
    min-width: 110px;
  }

  .gear-table td.col-dungeon select { min-width: 175px; }
  .gear-table td.col-boss select { min-width: 185px; }
  .gear-table td.col-source select { min-width: 108px; }
  .gear-table td.col-slot select { min-width: 108px; }

  /* Dungeon & Stage Cards */
  .instance-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .instance-card.forever-card { border-left: 3px solid var(--forever); }
  .instance-card.classic-card { border-left: 3px solid var(--border-strong); }

  .instance-header {
    width: 100%;
    text-align: left;
    background: var(--surface-2);
    border: none;
    border-radius: 0;
    padding: 9px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
  }

  .instance-header:hover { background: var(--hover); }

  .inst-left {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .chevron {
    display: inline-block;
    width: 14px;
    color: var(--muted);
    transition: transform 0.12s ease;
    font-size: 0.72rem;
  }

  .instance-card.open .chevron {
    transform: rotate(90deg);
    color: var(--forever-bright);
  }

  .inst-name {
    font-size: 0.96rem;
    font-weight: 700;
    color: var(--text-strong);
  }

  .inst-meta {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .instance-body {
    display: none;
    border-top: 1px solid var(--border);
  }

  .instance-card.open .instance-body { display: block; }

  .wing-banner {
    background: var(--surface-deep);
    color: var(--forever-text);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 5px 14px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  /* T0.5 Chain Specific Styles */
  .t05-stage-body {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .t05-turnin-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  .t05-turnin-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.45px;
    color: var(--muted);
    margin-right: 4px;
  }

  .t05-piece-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 0.8rem;
  }

  .t05-piece-chip.ready {
    border-color: var(--forever-border);
    background: var(--forever-tint-soft);
  }

  .t05-piece-chip.upgraded {
    border-color: rgba(63, 185, 80, 0.4);
    background: var(--success-tint);
    color: var(--success);
  }

  .t05-piece-chip input[type="checkbox"] {
    accent-color: var(--forever);
    cursor: pointer;
    margin: 0;
  }

  .t05-milestones {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .t05-milestone-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: var(--surface-deep);
    border: 1px solid #242424;
    border-radius: var(--radius-sm);
    font-size: 0.84rem;
  }

  .t05-milestone-row.done {
    opacity: 0.52;
  }

  .t05-milestone-row.done .ms-title {
    text-decoration: line-through;
  }

  .t05-milestone-row input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--forever);
    cursor: pointer;
    margin: 0;
  }

  .ms-title {
    font-weight: 600;
    color: var(--text-strong);
  }

  .ms-detail {
    color: var(--muted);
    font-size: 0.8rem;
  }

  .t05-amulet-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(240px, 1fr));
    gap: 8px;
    padding: 8px 10px;
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  @media (max-width: 720px) {
    .t05-amulet-grid { grid-template-columns: 1fr; }
  }

  .t05-amulet-picker {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .t05-amulet-picker label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.4px;
  }

  details.t05-mats {
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
  }

  details.t05-mats summary {
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--forever-text);
    user-select: none;
  }

  details.t05-mats ul {
    margin: 8px 0 4px;
    padding-left: 18px;
    color: var(--muted);
    font-size: 0.81rem;
  }

  details.t05-mats li {
    margin-bottom: 3px;
  }

  details.t05-mats strong {
    color: var(--text);
  }

  /* Tables */
  .table-wrap {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .instance-body .table-wrap {
    border: none;
    border-radius: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84rem;
  }

  th, td {
    padding: 7px 10px;
    text-align: left;
    border-bottom: 1px solid #242424;
    vertical-align: middle;
  }

  th {
    background: var(--surface-deep);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.45px;
    font-weight: 700;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }

  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover, th.sorted { color: var(--forever-text); }

  tr:last-child td { border-bottom: none; }
  tbody tr { background: var(--surface); }
  tbody tr:nth-child(even) { background: #161616; }
  tbody tr:hover { background: var(--hover); }
  tbody tr.row-obtained { opacity: 0.48; }
  tbody tr.row-obtained .boss-name { text-decoration: line-through; }
  tbody tr.row-targeted { background: var(--forever-tint-soft); }
  tbody tr.row-targeted:hover { background: var(--forever-tint); }

  .order-cell {
    color: var(--subtle);
    font-variant-numeric: tabular-nums;
    width: 36px;
    text-align: right;
  }

  .check-cell {
    width: 72px;
    text-align: center;
  }

  .check-cell input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--forever);
    cursor: pointer;
    vertical-align: middle;
  }

  .boss-name {
    font-weight: 600;
    color: var(--text-strong);
    white-space: nowrap;
  }

  .notes-cell {
    color: var(--muted);
    font-size: 0.8rem;
    min-width: 220px;
  }

  .sources-cell {
    color: var(--subtle);
    font-size: 0.75rem;
    min-width: 155px;
  }

  .remove-btn {
    padding: 3px 7px;
    font-size: 0.78rem;
    color: var(--muted);
    background: transparent;
    border-color: transparent;
  }

  .remove-btn:hover {
    color: #ef8a87;
    border-color: rgba(217, 83, 79, 0.4);
    background: var(--danger-tint);
  }

  /* To-Do item rows inside a boss cell */
  .todo-drops {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .drop-chip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px 8px;
    font-size: 0.8rem;
  }

  .drop-chip.done {
    opacity: 0.5;
    text-decoration: line-through;
  }

  .drop-chip input[type="checkbox"] {
    width: 14px;
    height: 14px;
    accent-color: var(--forever);
    cursor: pointer;
  }

  .slot-tag {
    background: var(--forever-tint);
    color: var(--forever-text);
    border: 1px solid var(--forever-border);
    border-radius: 2px;
    padding: 0 5px;
    font-size: 11px;
    font-weight: 600;
  }

  .set-tag {
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0 5px;
    font-size: 11px;
    font-weight: 600;
  }

  .progress-wrap { margin-bottom: 12px; }
  .progress-bar-bg {
    height: 6px;
    background: var(--surface-2);
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--forever);
    transition: width 0.2s ease;
  }
  .progress-bar-fill.complete { background: var(--success); }

  .empty-state {
    text-align: center;
    padding: 42px 20px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .empty-state h3 { margin: 0 0 8px; color: var(--text-strong); font-size: 1rem; }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 100;
    background: var(--forever);
    color: #ffffff;
    border: 1px solid var(--forever-border);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 0.84rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }

  .toast.show { opacity: 1; }

  .hidden { display: none !important; }

  @media (max-width: 920px) {
    .controls-grid { grid-template-columns: 1fr 1fr; }
    .controls-grid input[type="search"] { grid-column: 1 / -1; }
  }
</style>

function createDefaultGearset(name = "Pre-BiS Set 1") {

  };
}

function createCharacter(name = "Main", faction = "Horde", gearsets = null) {
  const sets = gearsets && gearsets.length ? gearsets : [createDefaultGearset("Pre-BiS Set 1")];

    id: uid(),

  const src = SOURCES.includes(item.source) ? item.source : "Dungeon";
  let t05Status = item.t05Status;
  if (!["need_t0", "have_t0", "t05"].includes(t05Status)) {
    t05Status = item.obtained ? "t05" : "need_t0";
  }
  const obtained = src === "T0.5" ? t05Status === "t05" : Boolean(item.obtained);
  let dungeon = String(item.dungeon || "");
  const boss = String(item.boss || "");
  if ((dungeon === "Blackrock Spire" || dungeon === "Dire Maul") && boss && allBosses.length) {
    const match = allBosses.find(b => b.Boss_Name === boss && b.Instance.startsWith(dungeon + ":"));
    if (match) dungeon = match.Instance;
  }
  return {
    id: item.id || uid(),
    obtained,
    t05Status,
    slot: SLOTS.includes(item.slot) ? item.slot : "Head",
    source: src,
    dungeon,
    boss,
    itemText: String(item.itemText || ""),
  };
}

function normalizeCharacter(c) {
  const gearsets = (Array.isArray(c.gearsets) && c.gearsets.length ? c.gearsets : [createDefaultGearset()]).map(gs => ({
    id: gs.id || uid(),
    name: String(gs.name || "Pre-BiS Set"),
    bookmarkUrl: String(gs.bookmarkUrl || ""),
    items: (Array.isArray(gs.items) ? gs.items : []).map(normalizeItem),
  }));
  const activeSetId = gearsets.some(g => g.id === c.activeSetId) ? c.activeSetId : gearsets[0].id;
  const t05Raw = c.t05 || {};
  const leftBranch = findBranchByBoss(t05Raw.leftAmuletBoss, "scholomance");
  const rightBranch = findBranchByBoss(t05Raw.rightAmuletBoss, "dme");
  return {
    id: c.id || uid(),
    name: String(c.name || "Main"),
    faction: c.faction === "Alliance" ? "Alliance" : "Horde",
    activeSetId,
    gearsets,
    t05: {
      milestones: t05Raw.milestones && typeof t05Raw.milestones === "object" ? { ...t05Raw.milestones } : {},
      prereqT0Owned: t05Raw.prereqT0Owned && typeof t05Raw.prereqT0Owned === "object" ? { ...t05Raw.prereqT0Owned } : {},
      componentsFirst: T05_AMULET_BRANCHES.some(b => b.id === t05Raw.componentsFirst) ? t05Raw.componentsFirst : leftBranch.id,
      leftAmuletBoss: leftBranch.boss,
      componentsSecond: T05_AMULET_BRANCHES.some(b => b.id === t05Raw.componentsSecond) ? t05Raw.componentsSecond : rightBranch.id,
      rightAmuletBoss: rightBranch.boss,
      showAllStages: Boolean(t05Raw.showAllStages),
    },
  };
}

function migrateToV2(raw) {
  if (raw && raw.version === 2 && Array.isArray(raw.characters) && raw.characters.length) {
    const characters = raw.characters.map(normalizeCharacter);
    const activeCharId = characters.some(c => c.id === raw.activeCharId) ? raw.activeCharId : characters[0].id;
    return { version: 2, activeCharId, characters };
  }
  if (raw && Array.isArray(raw.gearsets) && raw.gearsets.length) {
    const migratedChar = normalizeCharacter({
      id: uid(),
      name: "Main",
      faction: "Horde",
      activeSetId: raw.activeSetId,
      gearsets: raw.gearsets,
    });
    return { version: 2, activeCharId: migratedChar.id, characters: [migratedChar] };
  }
  const first = createCharacter("Main", "Horde");
  return { version: 2, activeCharId: first.id, characters: [first] };
}

function loadState() {
  try {
    const v2 = JSON.parse(localStorage.getItem(STORAGE_KEY_V2) || "null");
    if (v2) return migrateToV2(v2);
    const v1 = JSON.parse(localStorage.getItem(STORAGE_KEY_V1) || "null");
    if (v1) {
      const migrated = migrateToV2(v1);
      localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(migrated));
      return migrated;
    }
  } catch {}
  return migrateToV2(null);
}

function saveState() {
  localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(state));
}

function getActiveChar() {
  return state.characters.find(c => c.id === state.activeCharId) || state.characters[0];
}

function getActiveSet() {
  const ch = getActiveChar();
  return ch.gearsets.find(g => g.id === ch.activeSetId) || ch.gearsets[0];
}

function esc(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function isEndgame(r) {
  return r.Min_Level >= 50;
}

function isUrl(str) {
  return /^https?:\/\//i.test(String(str || "").trim());
}

const LOWERCASE_WORDS = new Set(["a", "an", "and", "at", "by", "for", "from", "in", "of", "on", "or", "the", "to", "with"]);

function parseWowheadItemUrl(str) {
  const s = String(str || "").trim();
  if (!isUrl(s)) return null;
  let parsed;
  try {
    parsed = new URL(s);
  } catch {
    return null;
  }
  const host = parsed.hostname.toLowerCase();
  if (host !== "wowhead.com" && !host.endsWith(".wowhead.com")) return null;

  const m = parsed.pathname.match(/\/item=(\d+)(?:\/([^/?#]+))?/i);
  if (!m) return null;

  const itemId = m[1];
  const slug = m[2];
  if (slug) {
    const words = decodeURIComponent(slug).replace(/[-_]+/g, " ").trim().split(/\s+/);
    const title = words.map((w, idx) => {
      const lower = w.toLowerCase();
      if (idx > 0 && LOWERCASE_WORDS.has(lower)) return lower;
      return lower.charAt(0).toUpperCase() + lower.slice(1);
    }).join(" ");
    if (title) return title;
  }
  return `Item #${itemId}`;
}

function shortLabelForItem(str) {
  const s = String(str || "").trim();
  if (!s) return "";
  const wh = parseWowheadItemUrl(s);
  if (wh) return wh;
  if (isUrl(s)) return "Item Link";
  return s;
}

function isItemDoneForBossTodo(item) {
  if (item.source === "T0.5") {
    return item.t05Status === "have_t0" || item.t05Status === "t05";
  }
  return Boolean(item.obtained);
}

function getCharacterT05Items(char) {
  const list = [];
  for (const gs of char.gearsets) {
    for (const item of gs.items) {
      if (item.source === "T0.5") list.push({ gearset: gs, item });
    }
  }
  return list;
}

function getMaxRequiredT05Stage(char) {
  const t05Items = getCharacterT05Items(char);
  if (!t05Items.length) return 0;
  let maxStage = 1;
  for (const { item } of t05Items) {
    const st = T05_SLOT_STAGE[item.slot];
    if (st && st > maxStage) maxStage = st;
  }
  return maxStage;
}

function getDungeonCatalog(onlyEndgame) {
  const map = new Map();
  for (const r of allBosses) {
    if (onlyEndgame && !isEndgame(r)) continue;
    if (!map.has(r.Instance)) {
      map.set(r.Instance, {
        name: r.Instance,
        origin: r.Origin,
        zone: r.Zone,
        level: r.Level_Range,
        minLevel: r.Min_Level,
        maxLevel: r.Max_Level,
        bosses: [],
      });
    }
    map.get(r.Instance).bosses.push(r);
  }
  for (const d of map.values()) {
    d.bosses.sort((a, b) => a.Boss_Order - b.Boss_Order);
  }
  return map;
}

function getBossRecord(dungeon, bossName) {
  return allBosses.find(b => b.Instance === dungeon && b.Boss_Name === bossName) || null;
}

// Collect actionable dungeon boss targets (regular Dungeon drops + T0.5 base-T0 drops + optional T0.5 quest bosses)
function getDerivedTargets(scope, includeT05Quests = true) {
  const ch = getActiveChar();
  const sets = scope === "all" ? ch.gearsets : [getActiveSet()];
  const entries = [];

  for (const gs of sets) {
    for (const item of gs.items) {
      if ((item.source === "Dungeon" || item.source === "T0.5") && item.dungeon && item.boss) {
        entries.push({
          kind: "item",
          gearsetId: gs.id,
          gearsetName: gs.name,
          dungeon: item.dungeon,
          boss: item.boss,
          done: isItemDoneForBossTodo(item),
          item,
          bossRec: getBossRecord(item.dungeon, item.boss),
        });
      }
    }
  }

  const maxStage = getMaxRequiredT05Stage(ch);
  if (includeT05Quests && maxStage > 0) {
    const stages = buildT05Stages(ch).filter(s => s.stage <= maxStage);
    for (const st of stages) {
      for (const ms of st.milestones) {
        if (ms.dungeon && ms.boss) {
          entries.push({
            kind: "t05_quest",
            stage: st.stage,
            milestoneId: ms.id,
            title: ms.title,
            dungeon: ms.dungeon,
            boss: ms.boss,
            done: Boolean(ch.t05.milestones[ms.id]),
            bossRec: getBossRecord(ms.dungeon, ms.boss),
          });
        }
      }
    }
  }

  return entries;
}

function updateTabCounts() {
  const ch = getActiveChar();
  const activeSet = getActiveSet();
  const totalItems = activeSet.items.length;
  const gotItems = activeSet.items.filter(i => i.obtained).length;
  els.countGear.textContent = `${gotItems}/${totalItems}`;

  const targets = getDerivedTargets(todoScope, showT05QuestBosses);
  const bossKeys = new Set();
  const remainingBossKeys = new Set();
  for (const t of targets) {
    const k = `${t.dungeon}||${t.boss}`;
    bossKeys.add(k);
    if (!t.done) remainingBossKeys.add(k);
  }
  els.countTodo.textContent = bossKeys.size ? `${remainingBossKeys.size}/${bossKeys.size}` : "0";

  const maxStage = getMaxRequiredT05Stage(ch);
  els.tabT05.classList.toggle("hidden", maxStage === 0);
  if (maxStage > 0) {
    const reqStages = buildT05Stages(ch).filter(s => s.stage <= maxStage);
    const allMs = reqStages.flatMap(s => s.milestones);
    const doneMs = allMs.filter(m => ch.t05.milestones[m.id]).length;
    els.countT05.textContent = `${doneMs}/${allMs.length}`;
  } else if (activeTab === "t05") {
    activeTab = "gear";
  }

  els.countCompendium.textContent = allBosses.length;
}

// ============================================================================
function encodeSharePayload(gs) {
  const payload = {
    n: gs.name,
    u: gs.bookmarkUrl || "",
    i: gs.items.map(x => [
      x.obtained ? 1 : 0,
      x.slot,
      x.source,
      (x.source === "Dungeon" || x.source === "T0.5") ? x.dungeon : "",
      (x.source === "Dungeon" || x.source === "T0.5") ? x.boss : "",
      x.itemText || "",
      x.source === "T0.5" ? x.t05Status : "",
    ]),
  };
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  let bin = "";
  bytes.forEach(b => (bin += String.fromCharCode(b)));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function decodeSharePayload(encoded) {
  const pad = "=".repeat((4 - (encoded.length % 4)) % 4);
  const b64 = encoded.replace(/-/g, "+").replace(/_/g, "/") + pad;
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const payload = JSON.parse(new TextDecoder().decode(bytes));
  if (!payload || !Array.isArray(payload.i)) throw new Error("Invalid share data");
  return {
    id: uid(),
    name: String(payload.n || "Shared Gearset").trim(),
    bookmarkUrl: String(payload.u || ""),
    items: payload.i.map(arr => normalizeItem({
      id: uid(),
      obtained: Boolean(arr[0]),
      slot: arr[1],
      source: arr[2],
      dungeon: arr[3],
      boss: arr[4],
      itemText: arr[5],
      t05Status: arr[6] || (arr[0] ? "t05" : "need_t0"),
    })),
  };
}

function checkIncomingShareHash() {
  const hash = window.location.hash || "";
  if (!hash.startsWith("#share=")) return;
  const code = hash.slice("#share=".length);
  try {
    const imported = decodeSharePayload(code);
    const ch = getActiveChar();
    if (confirm(`Import shared gearset "${imported.name}" (${imported.items.length} items) into character "${ch.name}"?`)) {
      ch.gearsets.push(imported);
      ch.activeSetId = imported.id;
      saveState();
      showToast(`Imported "${imported.name}"`);
    }
  } catch (err) {
    console.error(err);
    alert("Could not read the shared gearset link.");
  } finally {
    history.replaceState(null, "", window.location.pathname + window.location.search);
  }
}

async function copyShareLink() {
  const gs = getActiveSet();
  const code = encodeSharePayload(gs);
  const url = `${window.location.origin}${window.location.pathname}#share=${code}`;
  try {
    await navigator.clipboard.writeText(url);
    showToast(`Copied share link for "${gs.name}"`);
  } catch {
    prompt("Copy this shareable gearset link:", url);
  }
}

        <label class="chk">
          <input type="checkbox" id="chkGearHideObtained" ${gearHideObtained ? "checked" : ""} /> Hide obtained
        </label>
      </div>
    </div>

    ${visibleItems.length ? `
      <div class="table-wrap">
        <table class="gear-table">
          <thead>
            <tr>
              <th class="check-cell">Status</th>
              <th>Slot</th>
              <th>Source</th>
              <th>Dungeon</th>
              <th>Boss</th>
              <th>Item / Wowhead Link (User-managed)</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    ` : `
      <div class="empty-state">
        <h3>No gear rows shown</h3>
        <p>Click <strong>+ Add Gear Slot Row</strong> or adjust your filter above.</p>
      </div>
    `}
  `;
}

// ============================================================================
// TAB 2: AUTO-POPULATED BOSS TO-DO LIST
// ============================================================================
function renderTodoTab() {
  const ch = getActiveChar();
  const maxT05Stage = getMaxRequiredT05Stage(ch);
  const targets = getDerivedTargets(todoScope, showT05QuestBosses);
  const fullCatalog = getDungeonCatalog(false);

  const scopeSets = todoScope === "all" ? ch.gearsets : [getActiveSet()];
  const nonDungeonRem = scopeSets.reduce((acc, s) => acc + s.items.filter(i => i.source !== "Dungeon" && i.source !== "T0.5" && !i.obtained).length, 0);
  const unassignedDungeon = scopeSets.reduce((acc, s) => acc + s.items.filter(i => i.source === "Dungeon" && (!i.dungeon || !i.boss)).length, 0);

  const dungeonGroups = new Map();
  for (const t of targets) {
    if (!dungeonGroups.has(t.dungeon)) dungeonGroups.set(t.dungeon, new Map());
    const bossMap = dungeonGroups.get(t.dungeon);
    if (!bossMap.has(t.boss)) {
      bossMap.set(t.boss, {
        bossName: t.boss,
        bossRec: t.bossRec,
        entries: [],
      });
    }
    bossMap.get(t.boss).entries.push(t);
  }

  let totalBosses = 0;
  let completedBosses = 0;
  let totalObjectives = targets.length;
  let completedObjectives = targets.filter(t => t.done).length;

  for (const bossMap of dungeonGroups.values()) {
    for (const b of bossMap.values()) {
      totalBosses++;
      if (b.entries.every(e => e.done)) completedBosses++;
    }
  }

  const remainingBosses = totalBosses - completedBosses;
  const pct = totalObjectives ? Math.round((completedObjectives / totalObjectives) * 100) : 0;

  const toolbarHtml = `
    <div class="panel" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
      <div class="inline-tools">
        <div class="segmented" role="tablist">
          <button id="scopeActive" class="${todoScope === "active" ? "active" : ""}" type="button">Active Gearset (${esc(getActiveSet().name)})</button>
          <button id="scopeAll" class="${todoScope === "all" ? "active" : ""}" type="button">All Sets on ${esc(ch.name)} (${ch.gearsets.length})</button>
        </div>
        ${maxT05Stage > 0 ? `
          <label class="chk" title="Include T0.5 questline bosses up to Stage ${maxT05Stage}">
            <input type="checkbox" id="chkShowT05Quests" ${showT05QuestBosses ? "checked" : ""} /> Show T0.5 quest bosses
          </label>
        ` : ""}
      </div>
      <div class="inline-tools">
        <select id="todoSortSelect" aria-label="Sort To-Do dungeons">
          <option value="remaining_desc" ${todoSort === "remaining_desc" ? "selected" : ""}>Sort: Most Needed Bosses</option>
          <option value="level_asc" ${todoSort === "level_asc" ? "selected" : ""}>Sort: Level (Low → High)</option>
          <option value="level_desc" ${todoSort === "level_desc" ? "selected" : ""}>Sort: Level (High → Low)</option>
          <option value="instance_asc" ${todoSort === "instance_asc" ? "selected" : ""}>Sort: Instance (A → Z)</option>
        </select>
        <label class="chk">
          <input type="checkbox" id="chkTodoHideDone" ${todoHideDone ? "checked" : ""} /> Hide completed bosses
        </label>
      </div>
    </div>
  `;

  if (!totalBosses) {
    els.todoView.innerHTML = toolbarHtml + `
      <div class="empty-state">
        <h3>No dungeon bosses on ${esc(ch.name)}'s To-Do list yet</h3>
        <p style="max-width:540px;margin:0 auto 14px;">
          Your To-Do list is automatically built from the <strong>Gear Builder</strong> (Dungeon &amp; T0.5 rows) and your character's <strong>T0.5 Chain</strong> milestones.
        </p>
        ${unassignedDungeon ? `<p style="color:var(--forever-text);font-size:0.84rem;">You currently have <strong>${unassignedDungeon}</strong> Dungeon row(s) without a Dungeon &amp; Boss selected.</p>` : ""}
        <button id="btnGoGearBuilder" class="primary" type="button">Open Gear Builder</button>
      </div>
    `;
    return;
  }

  const statsHtml = `
    <div class="progress-wrap">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:0.82rem;color:var(--muted);margin-bottom:6px;">
        <span>
          Dungeon Bosses: <strong style="color:var(--text-strong)">${completedBosses} / ${totalBosses}</strong> done (${remainingBosses} remaining)
          &nbsp;•&nbsp;
          Objectives: <strong style="color:var(--text-strong)">${completedObjectives} / ${totalObjectives}</strong>
          ${nonDungeonRem ? `&nbsp;•&nbsp; Non-dungeon items remaining: <strong style="color:var(--text-strong)">${nonDungeonRem}</strong>` : ""}
        </span>
        <strong style="color:${pct === 100 ? "var(--success)" : "var(--forever-text)"}">${pct}%</strong>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill ${pct === 100 ? "complete" : ""}" style="width:${pct}%"></div>
      </div>
    </div>
  `;

  const cardData = [];
  for (const [dName, bossMap] of dungeonGroups.entries()) {
    const meta = fullCatalog.get(dName);
    let bosses = [...bossMap.values()].sort((a, b) =>
      (a.bossRec?.Boss_Order ?? 999) - (b.bossRec?.Boss_Order ?? 999) || a.bossName.localeCompare(b.bossName)
    );
    const totalInInst = bosses.length;
    const remInInst = bosses.filter(b => b.entries.some(e => !e.done)).length;
    if (todoHideDone) {
      bosses = bosses.filter(b => b.entries.some(e => !e.done));
    }
    if (!bosses.length) continue;
    cardData.push({ name: dName, meta, bosses, totalInInst, remInInst });
  }

  cardData.sort((a, b) => {
    if (todoSort === "remaining_desc") return b.remInInst - a.remInInst || (a.meta?.minLevel ?? 0) - (b.meta?.minLevel ?? 0) || a.name.localeCompare(b.name);
    if (todoSort === "level_asc") return (a.meta?.minLevel ?? 0) - (b.meta?.minLevel ?? 0) || a.name.localeCompare(b.name);
    if (todoSort === "level_desc") return (b.meta?.maxLevel ?? 0) - (a.meta?.maxLevel ?? 0) || a.name.localeCompare(b.name);
    if (todoSort === "instance_asc") return a.name.localeCompare(b.name);
    return 0;
  });

  if (!cardData.length) {
    els.todoView.innerHTML = toolbarHtml + statsHtml + `
      <div class="empty-state">
        <h3>All dungeon farm targets are completed!</h3>
        <p>Uncheck "Hide completed bosses" to review your completed targets.</p>
      </div>
    `;
    return;
  }

  const cardsHtml = cardData.map(g => {
    const isForever = g.meta?.origin === "WoW Forever";
    const rowsHtml = g.bosses.map(b => {
      const allDone = b.entries.every(e => e.done);
      const wing = b.bossRec?.Wing || "Main";
      const bType = b.bossRec?.Boss_Type || "Main";
      const order = b.bossRec?.Boss_Order ?? "—";
      const bossNotes = b.bossRec?.Notes || "";

      const dropsHtml = b.entries.map(e => {
        if (e.kind === "t05_quest") {
          return `
            <div class="drop-chip ${e.done ? "done" : ""}">
              <input type="checkbox" data-todo-t05-ms="${esc(e.milestoneId)}" ${e.done ? "checked" : ""} title="Mark T0.5 quest milestone complete (syncs with T0.5 Chain tab)" />
              <span class="t05-quest-tag">T0.5 Stage ${e.stage}</span>
              <span style="color:var(--text)">${esc(e.title)}</span>
            </div>
          `;
        }
        const label = shortLabelForItem(e.item.itemText);
        const link = isUrl(e.item.itemText);
        const isT05 = e.item.source === "T0.5";
        return `
          <div class="drop-chip ${e.done ? "done" : ""}">
            <input type="checkbox" data-todo-item-id="${esc(e.item.id)}" data-todo-set-id="${esc(e.gearsetId)}" ${e.done ? "checked" : ""} title="${isT05 ? "Mark Base T0 drop obtained (advances Need T0 ↔ Have T0)" : "Mark drop obtained (syncs with Gear Builder)"}" />
            <span class="slot-tag">${esc(e.item.slot)}</span>
            ${isT05 ? `<span class="base-t0-tag">${e.item.t05Status === "t05" ? "T0.5 ✓" : "Base T0"}</span>` : ""}
            ${todoScope === "all" ? `<span class="set-tag">${esc(e.gearsetName)}</span>` : ""}
            ${link
              ? `<a href="${esc(e.item.itemText.trim())}" target="_blank" rel="noopener noreferrer" style="color:var(--forever-text);text-decoration:none;">${esc(label)} ↗</a>`
              : `<span style="color:${label ? "var(--text)" : "var(--muted)"}">${esc(label || (isT05 ? "Base T0 drop" : "Needed item"))}</span>`
            }
          </div>
        `;
      }).join("");

      return `
        <tr class="${allDone ? "row-obtained" : ""}">
          <td class="order-cell">${order}</td>
          <td class="boss-name">
            ${esc(b.bossName)}
            ${allDone ? `<span class="badge done-tag" style="margin-left:6px;">✓ Done</span>` : ""}
          </td>
          <td style="color:var(--muted);white-space:nowrap">${esc(wing)}</td>
          <td><span class="badge type-${esc(bType)}">${esc(bType)}</span></td>
          <td class="notes-cell">${esc(bossNotes)}</td>
          <td><div class="todo-drops">${dropsHtml}</div></td>
        </tr>
      `;
    }).join("");

    return `
      <section class="instance-card open ${isForever ? "forever-card" : "classic-card"}">
        <div class="instance-header" style="cursor:default">
          <div class="inst-left">
            <span class="inst-name">${esc(g.name)}</span>
            ${g.meta ? `<span class="badge ${isForever ? "origin-forever" : "origin-classic"}">${esc(g.meta.origin)}</span>` : ""}
          </div>
          <div class="inst-meta">
            ${g.meta ? `<span>Lv. ${esc(g.meta.level)}</span><span>•</span><span>${esc(g.meta.zone)}</span><span>•</span>` : ""}
            <span><strong style="color:var(--forever-text)">${g.remInInst}</strong> / ${g.totalInInst} bosses remaining</span>
          </div>
        </div>
        <div class="instance-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="order-cell">#</th>
                  <th>Boss Name</th>
                  <th>Wing</th>
                  <th>Type</th>
                  <th>Boss Notes</th>
                  <th>Needed Drops &amp; T0.5 Quests</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>
      </section>
    `;
  }).join("");

  els.todoView.innerHTML = toolbarHtml + statsHtml + cardsHtml;
}

// ============================================================================
// TAB 3: AUTO-UNLOCKING T0.5 CHAIN TAB
// ============================================================================
function renderT05Tab() {
  const ch = getActiveChar();
  const maxStage = getMaxRequiredT05Stage(ch);
  if (maxStage === 0) {
    els.t05View.innerHTML = `
      <div class="empty-state">
        <h3>No T0.5 pieces configured for ${esc(ch.name)}</h3>
        <p>Set any slot's Source to <strong>T0.5</strong> in the Gear Builder to activate the T0.5 Chain tracker.</p>
      </div>
    `;
    return;
  }

  const allT05Items = getCharacterT05Items(ch);
  const trackedSlots = new Set(allT05Items.map(x => x.item.slot));
  const stages = buildT05Stages(ch);
  const visibleStages = ch.t05.showAllStages ? stages : stages.filter(s => s.stage <= maxStage);

  const reqMilestones = stages.filter(s => s.stage <= maxStage).flatMap(s => s.milestones);
  const doneMilestones = reqMilestones.filter(m => ch.t05.milestones[m.id]).length;
  const pct = reqMilestones.length ? Math.round((doneMilestones / reqMilestones.length) * 100) : 0;

  const neededSlotList = [...trackedSlots].join(", ");

  const summaryHtml = `
    <div class="panel">
      <div class="gearset-bar">
        <div class="inline-tools">
          <strong style="color:var(--text-strong);font-size:0.94rem;">${esc(ch.name)} — Dungeon Set 2 (T0.5) Progression</strong>
          <span class="badge accent-badge">Required up to Stage ${maxStage}</span>
          <span style="color:var(--muted);font-size:0.8rem;">Tracked T0.5 slots: <strong style="color:var(--text)">${esc(neededSlotList)}</strong></span>
        </div>
        <div class="inline-tools">
          ${maxStage < 4 ? `
            <label class="chk">
              <input type="checkbox" id="chkT05ShowAll" ${ch.t05.showAllStages ? "checked" : ""} /> Show all 4 stages
            </label>
          ` : ""}
          <a class="link-btn" href="${T05_GUIDE_URL}" target="_blank" rel="noopener noreferrer">Wowhead T0.5 Guide ↗</a>
        </div>
      </div>

      <div class="progress-wrap" style="margin-top:12px;margin-bottom:0;">
        <div style="display:flex;justify-content:space-between;font-size:0.81rem;color:var(--muted);margin-bottom:5px;">
          <span>Questline Milestones (Stages 1–${maxStage}): <strong style="color:var(--text-strong)">${doneMilestones} / ${reqMilestones.length}</strong></span>
          <strong style="color:${pct === 100 ? "var(--success)" : "var(--forever-text)"}">${pct}%</strong>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill ${pct === 100 ? "complete" : ""}" style="width:${pct}%"></div>
        </div>
      </div>
    </div>
  `;

  const cardsHtml = visibleStages.map(st => {
    const stageDoneCount = st.milestones.filter(m => ch.t05.milestones[m.id]).length;
    const stageComplete = stageDoneCount === st.milestones.length;
    const hasTargetSlot = st.slots.some(sl => trackedSlots.has(sl));
    const roleTag = st.stage > maxStage
      ? `<span class="badge origin-classic">Optional (Stage ${st.stage})</span>`
      : (hasTargetSlot
          ? `<span class="badge accent-badge">Target Stage</span>`
          : `<span class="badge origin-classic">Prerequisite Stage</span>`);

    // Check if any character gear rows in this stage can be bulk-upgraded to T0.5 ✓
    const stageGearItems = allT05Items.filter(x => st.slots.includes(x.item.slot));
    const upgradableCount = stageGearItems.filter(x => x.item.t05Status !== "t05").length;

    const piecesHtml = st.slots.map(slot => {
      const matching = allT05Items.filter(x => x.item.slot === slot);
      if (matching.length) {
        const allUpgraded = matching.every(x => x.item.t05Status === "t05");
        const allHaveT0 = matching.every(x => x.item.t05Status === "have_t0" || x.item.t05Status === "t05");
        const cls = allUpgraded ? "upgraded" : (allHaveT0 ? "ready" : "");
        const statusTxt = allUpgraded ? "T0.5 ✓" : (allHaveT0 ? "Have T0" : "Need T0");
        return `
          <span class="t05-piece-chip ${cls}" title="Synced with your Gear Builder ${esc(slot)} row(s)">
            <strong>${esc(slot)}</strong>
            <span style="font-size:11px;color:${allUpgraded ? "var(--success)" : (allHaveT0 ? "var(--forever-text)" : "var(--muted)")}">${statusTxt}</span>
          </span>
        `;
      } else {
        const owned = Boolean(ch.t05.prereqT0Owned[slot]);
        return `
          <label class="t05-piece-chip ${owned ? "ready" : ""}" style="cursor:pointer;" title="Sequential questline prerequisite (not in your final Pre-BiS gearset)">
            <input type="checkbox" data-t05-prereq="${esc(slot)}" ${owned ? "checked" : ""} />
            <span>T0 ${esc(slot)} <span style="color:var(--muted);font-size:11px;">(prereq)</span></span>
          </label>
        `;
      }
    }).join("");

    const amuletHtml = st.hasAmuletPickers ? `
      <div class="t05-amulet-grid">
        <div class="t05-amulet-picker">
          <label for="selComp1">1. Components of Importance (1 of 4)</label>
          <select id="selComp1">
            ${T05_AMULET_BRANCHES.map(b => `<option value="${esc(b.id)}" ${ch.t05.componentsFirst === b.id ? "selected" : ""}>${esc(b.componentLabel)}</option>`).join("")}
          </select>
        </div>
        <div class="t05-amulet-picker">
          <label for="selLeftAmulet">2. Left Piece Boss (1 of 4 → Boss To-Do)</label>
          <select id="selLeftAmulet">
            ${T05_AMULET_BRANCHES.map(b => `<option value="${esc(b.boss)}" ${ch.t05.leftAmuletBoss === b.boss ? "selected" : ""}>${esc(b.bossLabel)}</option>`).join("")}
          </select>
        </div>
        <div class="t05-amulet-picker">
          <label for="selComp2">3. More Components of Importance (1 of 4)</label>
          <select id="selComp2">
            ${T05_AMULET_BRANCHES.map(b => `<option value="${esc(b.id)}" ${ch.t05.componentsSecond === b.id ? "selected" : ""}>${esc(b.componentLabel)}</option>`).join("")}
          </select>
        </div>
        <div class="t05-amulet-picker">
          <label for="selRightAmulet">4. Right Piece Boss (1 of 4 → Boss To-Do)</label>
          <select id="selRightAmulet">
            ${T05_AMULET_BRANCHES.map(b => `<option value="${esc(b.boss)}" ${ch.t05.rightAmuletBoss === b.boss ? "selected" : ""}>${esc(b.bossLabel)}</option>`).join("")}
          </select>
        </div>
      </div>
    ` : "";

    const milestonesHtml = st.milestones.map(ms => {
      const done = Boolean(ch.t05.milestones[ms.id]);
      return `
        <label class="t05-milestone-row ${done ? "done" : ""}" style="cursor:pointer;">
          <input type="checkbox" data-t05-ms="${esc(ms.id)}" ${done ? "checked" : ""} />
          <span class="ms-title">${esc(ms.title)}</span>
          ${ms.dungeon && ms.boss ? `<span class="t05-quest-tag">${esc(ms.dungeon)} → ${esc(ms.boss)}</span>` : ""}
          <span class="ms-detail">${esc(ms.detail)}</span>
        </label>
      `;
    }).join("");

    return `
      <section class="instance-card open ${stageComplete ? "classic-card" : "forever-card"}">
        <div class="instance-header" style="cursor:default">
          <div class="inst-left">
            <span class="inst-name">${esc(st.title)}</span>
            ${roleTag}
            ${stageComplete ? `<span class="badge done-tag">✓ Complete</span>` : ""}
          </div>
          <div class="inst-meta">
            <span>${esc(st.summary)}</span>
            <span>•</span>
            <span><strong style="color:var(--forever-text)">${stageDoneCount}/${st.milestones.length}</strong> steps</span>
            ${upgradableCount > 0 ? `<button type="button" class="primary" style="padding:3px 8px;font-size:11px;" data-upgrade-stage="${st.stage}">Mark Stage Pieces T0.5 ✓</button>` : ""}
          </div>
        </div>
        <div class="instance-body">
          <div class="t05-stage-body">
            <div class="t05-turnin-strip">
              <span class="t05-turnin-label">T0 Turn-In Pieces:</span>
              ${piecesHtml}
            </div>
            ${amuletHtml}
            <div class="t05-milestones">${milestonesHtml}</div>
            <details class="t05-mats">
              <summary>Materials &amp; Gold Shopping List (Stage ${st.stage})</summary>
              <ul>${st.materials.map(m => `<li>${m}</li>`).join("")}</ul>
            </details>
          </div>
        </div>
      </section>
    `;
  }).join("");

  els.t05View.innerHTML = summaryHtml + cardsHtml;
}

// ============================================================================
// TAB 4: DUNGEON COMPENDIUM (READ-ONLY REFERENCE)
// ============================================================================
function populateInstanceDropdown() {
  const current = els.instance.value;
  const catalog = getDungeonCatalog(endgameOnly);
  const sorted = [...catalog.values()].sort((a, b) => a.name.localeCompare(b.name));
  let html = `<option value="">All ${endgameOnly ? "Endgame " : ""}Instances (${sorted.length})</option>`;
  html += sorted.map(d => `<option value="${esc(d.name)}">${esc(d.name)} (${esc(d.level)})</option>`).join("");
  els.instance.innerHTML = html;
  els.instance.value = catalog.has(current) ? current : "";
}

function getFilteredCompendiumRows() {
  const q = els.search.value.trim().toLowerCase();
  const inst = els.instance.value;
  const type = els.type.value;
  const coreOnly = els.coreOnly.checked;

  return allBosses.filter(r => {
    if (endgameOnly && !isEndgame(r)) return false;
    if (inst && r.Instance !== inst) return false;
    if (type && r.Boss_Type !== type) return false;
    if (coreOnly && r.Boss_Type !== "Main" && r.Boss_Type !== "Final") return false;
    if (q) {
      const hay = `${r.Instance} ${r.Wing} ${r.Boss_Name} ${r.Boss_Type} ${r.Origin} ${r.Zone} ${r.Level_Range} ${r.Verification_Sources} ${r.Notes}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function getBossTargetCounts() {
  const map = new Map();
  for (const t of getDerivedTargets("all", true)) {
    const k = `${t.dungeon}||${t.boss}`;
    if (!map.has(k)) map.set(k, { total: 0, remaining: 0 });
    const obj = map.get(k);
    obj.total++;
    if (!t.done) obj.remaining++;
  }
  return map;
}

function renderCompendiumInstanceTable(bosses, targetCounts) {
  const rowsHtml = bosses.map(r => {
    const tc = targetCounts.get(`${r.Instance}||${r.Boss_Name}`);
    const statusBadge = tc
      ? (tc.remaining > 0
          ? `<span class="badge accent-badge" style="margin-left:6px;">${tc.remaining} needed</span>`
          : `<span class="badge done-tag" style="margin-left:6px;">✓ Done</span>`)
      : "";
    return `
      <tr class="${tc && tc.remaining > 0 ? "row-targeted" : ""}">
        <td class="order-cell">${r.Boss_Order}</td>
        <td class="boss-name">${esc(r.Boss_Name)}${statusBadge}</td>
        <td><span class="badge type-${esc(r.Boss_Type)}">${esc(r.Boss_Type)}</span></td>
        <td class="notes-cell">${esc(r.Notes)}</td>
        <td class="sources-cell">${esc(r.Verification_Sources)}</td>
      </tr>
    `;
  }).join("");

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="order-cell">#</th>
            <th>Boss Name</th>
            <th>Type</th>
            <th>Notes</th>
            <th>Sources</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

function renderCompendiumTab() {
  const filtered = getFilteredCompendiumRows();
  const targetCounts = getBossTargetCounts();
  const instSet = new Set(filtered.map(r => r.Instance));
  const targetedInView = filtered.filter(r => targetCounts.has(`${r.Instance}||${r.Boss_Name}`)).length;

  els.stats.innerHTML = `
    <span class="stat-pill">Showing <strong>${filtered.length}</strong> / ${allBosses.length} bosses</span>
    <span class="stat-pill">Instances: <strong>${instSet.size}</strong>${endgameOnly ? " (Endgame 50+)" : ""}</span>
    <span class="stat-pill accent">Targeted on ${esc(getActiveChar().name)}: <strong>${targetedInView}</strong> bosses</span>
  `;

  els.expandAll.classList.toggle("hidden", viewMode !== "grouped");
  els.collapseAll.classList.toggle("hidden", viewMode !== "grouped");

  if (!filtered.length) {
    els.compendiumView.innerHTML = `<div class="empty-state"><h3>No matching bosses</h3>Try adjusting your search or filter settings.</div>`;
    return;
  }

  if (viewMode === "grouped") {
    const groups = new Map();
    for (const r of filtered) {
      if (!groups.has(r.Instance)) groups.set(r.Instance, []);
      groups.get(r.Instance).push(r);
    }
    const groupArr = [...groups.entries()].map(([name, bosses]) => {
      bosses.sort((a, b) => a.Boss_Order - b.Boss_Order);
      return { name, bosses, sample: bosses[0], minLevel: bosses[0].Min_Level, maxLevel: bosses[0].Max_Level, count: bosses.length };
    });
    const sortMode = els.sort.value;
    groupArr.sort((a, b) => {
      if (sortMode === "instance_asc") return a.name.localeCompare(b.name);
      if (sortMode === "instance_desc") return b.name.localeCompare(a.name);
      if (sortMode === "level_asc") return a.minLevel - b.minLevel || a.maxLevel - b.maxLevel || a.name.localeCompare(b.name);
      if (sortMode === "level_desc") return b.maxLevel - a.maxLevel || b.minLevel - a.minLevel || a.name.localeCompare(b.name);
      if (sortMode === "bosses_desc") return b.count - a.count || a.name.localeCompare(b.name);
      if (sortMode === "bosses_asc") return a.count - b.count || a.name.localeCompare(b.name);
      return 0;
    });

    const autoOpen = Boolean(els.search.value.trim() || els.instance.value);
    els.compendiumView.innerHTML = groupArr.map(g => {
      const isOpen = autoOpen || openInstances.has(g.name);
      const isForever = g.sample.Origin === "WoW Forever";
      const wings = [...new Set(g.bosses.map(b => b.Wing))];
      const hasMultipleWings = wings.length > 1 || (wings.length === 1 && wings[0] !== "Main");
      const neededHere = g.bosses.filter(b => (targetCounts.get(`${b.Instance}||${b.Boss_Name}`)?.remaining || 0) > 0).length;

      let bodyHtml = "";
      if (hasMultipleWings) {
        for (const w of wings) {
          const wBosses = g.bosses.filter(b => b.Wing === w);
          bodyHtml += `<div class="wing-banner">${esc(w)} (${wBosses.length})</div>`;
          bodyHtml += renderCompendiumInstanceTable(wBosses, targetCounts);
        }
      } else {
        bodyHtml = renderCompendiumInstanceTable(g.bosses, targetCounts);
      }

      return `
        <section class="instance-card ${isForever ? "forever-card" : "classic-card"} ${isOpen ? "open" : ""}">
          <button type="button" class="instance-header" data-toggle="${esc(g.name)}">
            <div class="inst-left">
              <span class="chevron">▶</span>
              <span class="inst-name">${esc(g.name)}</span>
              <span class="badge ${isForever ? "origin-forever" : "origin-classic"}">${esc(g.sample.Origin)}</span>
              ${neededHere ? `<span class="badge accent-badge">${neededHere} boss(es) needed</span>` : ""}
            </div>
            <div class="inst-meta">
              <span>Lv. ${esc(g.sample.Level_Range)}</span>
              <span>•</span>
              <span>${esc(g.sample.Zone)}</span>
              <span>•</span>
              <span><strong>${g.count}</strong> bosses</span>
            </div>
          </button>
          <div class="instance-body">${bodyHtml}</div>
        </section>
      `;
    }).join("");
  } else {
    const sorted = filtered.slice().sort((a, b) => {
      const { col, dir } = tableSort;
      let cmp = (col === "Boss_Order" || col === "Min_Level") ? (a[col] - b[col]) : String(a[col]).localeCompare(String(b[col]));
      if (cmp === 0) cmp = a.Instance.localeCompare(b.Instance) || a.Boss_Order - b.Boss_Order;
      return dir === "asc" ? cmp : -cmp;
    });

    const cols = [
      ["Instance", "Instance"], ["Wing", "Wing"], ["Boss_Order", "#"],
      ["Boss_Name", "Boss Name"], ["Boss_Type", "Type"], ["Min_Level", "Level"],
      ["Zone", "Zone"], ["Notes", "Notes"]
    ];
    const thHtml = cols.map(([k, l]) => {
      const active = tableSort.col === k;
      return `<th class="sortable ${active ? "sorted" : ""}" data-sort-col="${k}">${l}${active ? (tableSort.dir === "asc" ? " ▲" : " ▼") : ""}</th>`;
    }).join("");

    const bodyHtml = sorted.map(r => {
      const tc = targetCounts.get(`${r.Instance}||${r.Boss_Name}`);
      const badge = tc ? (tc.remaining > 0 ? `<span class="badge accent-badge" style="margin-left:6px;">${tc.remaining} needed</span>` : `<span class="badge done-tag" style="margin-left:6px;">✓</span>`) : "";
      return `
        <tr class="${tc && tc.remaining > 0 ? "row-targeted" : ""}">
          <td><strong>${esc(r.Instance)}</strong></td>
          <td style="color:var(--muted)">${esc(r.Wing)}</td>
          <td class="order-cell">${r.Boss_Order}</td>
          <td class="boss-name">${esc(r.Boss_Name)}${badge}</td>
          <td><span class="badge type-${esc(r.Boss_Type)}">${esc(r.Boss_Type)}</span></td>
          <td style="white-space:nowrap">${esc(r.Level_Range)}</td>
          <td>${esc(r.Zone)}</td>
          <td class="notes-cell">${esc(r.Notes)}</td>
        </tr>
      `;
    }).join("");

    els.compendiumView.innerHTML = `<div class="table-wrap"><table><thead><tr>${thHtml}</tr></thead><tbody>${bodyHtml}</tbody></table></div>`;
  }
}

// ============================================================================
// CSV / JSON IMPORT & EXPORT
// ============================================================================
function parseCsvRows(text) {
  const rows = [];
  let row = [], cell = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (inQuotes) {
      if (ch === '"' && next === '"') { cell += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { cell += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { row.push(cell); cell = ""; }
      else if (ch === '\r' && next === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; i++; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; }
      else { cell += ch; }
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function parseBossCsv(text) {
  const rows = parseCsvRows(text);
  const header = (rows.shift() || []).map(h => h.trim().replace(/^\uFEFF/, ""));
  return rows.filter(r => r.length >= header.length && r.some(c => c.trim())).map(r => {
    const obj = {};
    header.forEach((h, idx) => obj[h] = (r[idx] ?? "").trim());
    obj.Boss_Order = parseInt(obj.Boss_Order, 10) || 0;
    const parts = String(obj.Level_Range || "0").replace("–", "-").split("-");
    obj.Min_Level = parseInt(parts[0], 10) || 0;
    obj.Max_Level = parseInt(parts[1] || parts[0], 10) || 0;
    return obj;
  });
}

function resolveDungeonAndBoss(rawDungeon, rawBoss) {
  const dRaw = (rawDungeon || "").trim();
  const bRaw = (rawBoss || "").trim();
  if (!dRaw && !bRaw) return { dungeon: "", boss: "" };

  const aliases = {
    "brd": "Blackrock Depths",
    "lbrs": "Blackrock Spire: Lower (LBRS)",
    "lower blackrock spire": "Blackrock Spire: Lower (LBRS)",
    "ubrs": "Blackrock Spire: Upper (UBRS)",
    "upper blackrock spire": "Blackrock Spire: Upper (UBRS)",
    "dm east": "Dire Maul: East",
    "dire maul east": "Dire Maul: East",
    "dme": "Dire Maul: East",
    "dm west": "Dire Maul: West",
    "dire maul west": "Dire Maul: West",
    "dmw": "Dire Maul: West",
    "dm north": "Dire Maul: North",
    "dire maul north": "Dire Maul: North",
    "dmn": "Dire Maul: North",
    "strat live": "Stratholme",
    "strat undead": "Stratholme",
    "strat": "Stratholme",
    "scholo": "Scholomance",
    "st": "The Temple of Atal'Hakkar (Sunken Temple)",
    "sunken temple": "The Temple of Atal'Hakkar (Sunken Temple)",
    "zf": "Zul'Farrak",
    "rfc": "Ragefire Chasm",
    "wc": "Wailing Caverns",
    "sfk": "Shadowfang Keep",
    "bfd": "Blackfathom Deeps",
    "rfk": "Razorfen Kraul",
    "rfd": "Razorfen Downs",
    "sm": "Scarlet Monastery",
  };

  const allInstNames = [...new Set(allBosses.map(b => b.Instance))];
  let dungeon = aliases[dRaw.toLowerCase()] ||
    allInstNames.find(n => n.toLowerCase() === dRaw.toLowerCase()) ||
    allInstNames.find(n => n.toLowerCase().includes(dRaw.toLowerCase())) || "";

  let boss = "";
  if (dungeon && bRaw) {
    const candidates = allBosses.filter(b => b.Instance === dungeon);
    const exact = candidates.find(b => b.Boss_Name.toLowerCase() === bRaw.toLowerCase());
    const partial = candidates.find(b => b.Boss_Name.toLowerCase().includes(bRaw.toLowerCase()));
    boss = (exact || partial)?.Boss_Name || "";
  }
  return { dungeon, boss };
}

function importGearCsv(text, filename) {
  const rawRows = parseCsvRows(text);
  if (rawRows.length < 2) return;
  const header = rawRows[0].map(h => h.trim().replace(/^\uFEFF/, "").toLowerCase());
  const idxObt = header.findIndex(h => h === "" || h === "obtained" || h === "got" || h === "done" || h === "status");
  const idxT05 = header.indexOf("t05_status");
  const idxSlot = header.indexOf("slot");
  const idxDung = header.indexOf("dungeon");
  const idxBoss = header.indexOf("boss");
  const idxSrc = header.indexOf("source");
  const idxItem = header.findIndex(h => h === "item" || h === "link" || h === "item / link");

  const items = [];
  for (let i = 1; i < rawRows.length; i++) {
    const r = rawRows[i];
    const slotRaw = (r[idxSlot] || "").trim();
    const srcRaw = (r[idxSrc] || "").trim();
    const itemRaw = (r[idxItem] || "").trim();
    if (!slotRaw && !srcRaw && !itemRaw) continue;

    const slot = SLOTS.find(s => s.toLowerCase() === slotRaw.toLowerCase()) || "Head";
    const source = SOURCES.find(s => s.toLowerCase() === srcRaw.toLowerCase()) || "Dungeon";
    const obtained = String(r[idxObt] || "").trim().toUpperCase() === "TRUE" || String(r[idxObt] || "").trim().toLowerCase() === "yes";
    const t05Status = idxT05 >= 0 && r[idxT05] ? r[idxT05].trim() : (obtained ? "t05" : "need_t0");
    const resolved = (source === "Dungeon" || source === "T0.5") ? resolveDungeonAndBoss(r[idxDung], r[idxBoss]) : { dungeon: "", boss: "" };

    items.push(normalizeItem({
      id: uid(),
      obtained,
      t05Status,
      slot,
      source,
      dungeon: resolved.dungeon,
      boss: resolved.boss,
      itemText: itemRaw,
    }));
  }

  if (!items.length) {
    alert("No valid gear rows found in CSV.");
    return;
  }

  const ch = getActiveChar();
  const setName = filename.replace(/\.csv$/i, "").trim() || `Imported Set ${ch.gearsets.length + 1}`;
  const newSet = { id: uid(), name: setName, bookmarkUrl: "", items };
  ch.gearsets.push(newSet);
  ch.activeSetId = newSet.id;
  saveState();
  render();
  showToast(`Imported "${setName}" (${items.length} items)`);
}

function downloadBlob(content, mime, filename) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportCsv() {
  const csvCell = v => {
    const s = String(v ?? "");
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const ch = getActiveChar();
  let cols, dataRows, filename;

  if (activeTab === "gear") {
    const gs = getActiveSet();
    cols = ["Obtained", "T05_Status", "Slot", "Dungeon", "Boss", "Source", "Item"];
    dataRows = gs.items.map(i => ({
      Obtained: i.obtained ? "TRUE" : "FALSE",
      T05_Status: i.source === "T0.5" ? i.t05Status : "",
      Slot: i.slot,
      Dungeon: (i.source === "Dungeon" || i.source === "T0.5") ? i.dungeon : "",
      Boss: (i.source === "Dungeon" || i.source === "T0.5") ? i.boss : "",
      Source: i.source,
      Item: i.itemText,
    }));
    filename = `${ch.name}_${gs.name}_gear.csv`.toLowerCase().replace(/[^a-z0-9_.]+/g, "_");
  } else if (activeTab === "todo") {
    cols = ["Character", "Kind", "Gearset_or_Stage", "Instance", "Wing", "Boss_Order", "Boss_Name", "Boss_Type", "Boss_Notes", "Slot", "Done", "Item_or_Quest"];
    dataRows = getDerivedTargets(todoScope, showT05QuestBosses).map(t => ({
      Character: ch.name,
      Kind: t.kind === "t05_quest" ? "T0.5 Quest" : (t.item.source === "T0.5" ? "Base T0" : "Gear Drop"),
      Gearset_or_Stage: t.kind === "t05_quest" ? `Stage ${t.stage}` : t.gearsetName,
      Instance: t.dungeon,
      Wing: t.bossRec?.Wing || "Main",
      Boss_Order: t.bossRec?.Boss_Order ?? "",
      Boss_Name: t.boss,
      Boss_Type: t.bossRec?.Boss_Type || "",
      Boss_Notes: t.bossRec?.Notes || "",
      Slot: t.kind === "t05_quest" ? "T0.5" : t.item.slot,
      Done: t.done ? "TRUE" : "FALSE",
      Item_or_Quest: t.kind === "t05_quest" ? t.title : t.item.itemText,
    }));
    filename = `${ch.name}_boss_todo.csv`.toLowerCase().replace(/[^a-z0-9_.]+/g, "_");
  } else if (activeTab === "t05") {
    const maxStage = getMaxRequiredT05Stage(ch);
    const stages = buildT05Stages(ch).filter(s => ch.t05.showAllStages || s.stage <= maxStage);
    cols = ["Character", "Faction", "Stage", "Milestone", "Dungeon", "Boss", "Completed"];
    dataRows = stages.flatMap(st => st.milestones.map(ms => ({
      Character: ch.name,
      Faction: ch.faction,
      Stage: st.stage,
      Milestone: ms.title,
      Dungeon: ms.dungeon || "",
      Boss: ms.boss || "",
      Completed: ch.t05.milestones[ms.id] ? "TRUE" : "FALSE",
    })));
    filename = `${ch.name}_t05_chain.csv`.toLowerCase().replace(/[^a-z0-9_.]+/g, "_");
  } else {
    cols = ["Instance","Wing","Boss_Order","Boss_Name","Boss_Type","Origin","Zone","Continent","Level_Range","Verification_Sources","Notes"];
    dataRows = getFilteredCompendiumRows();
    filename = "wow_forever_dungeon_bosses_filtered.csv";
  }

  const lines = [cols.join(",")].concat(dataRows.map(r => cols.map(c => csvCell(r[c])).join(",")));
  downloadBlob(lines.join("\r\n"), "text/csv;charset=utf-8;", filename);
}

function backupJson() {
  const payload = JSON.stringify(state, null, 2);
  const stamp = new Date().toISOString().slice(0, 10);
  downloadBlob(payload, "application/json;charset=utf-8;", `wow_forever_tracker_backup_${stamp}.json`);
  showToast("Downloaded full JSON backup");
}

function restoreJson(text) {
  try {
    const parsed = JSON.parse(text);
    const isV2 = parsed && parsed.version === 2 && Array.isArray(parsed.characters) && parsed.characters.length;
    const isV1 = parsed && Array.isArray(parsed.gearsets) && parsed.gearsets.length;
    if (!isV2 && !isV1) throw new Error("Invalid backup");

    const msg = isV2
      ? `Restore ${parsed.characters.length} character(s)? This replaces your current saved data.`
      : `Restore v1 backup (${parsed.gearsets.length} gearset(s)) as a character? This replaces your current saved data.`;
    if (!confirm(msg)) return;

    state = migrateToV2(parsed);
    saveState();
    render();
    showToast(`Restored ${state.characters.length} character(s)`);
  } catch {
    alert("Invalid backup JSON file.");
  }
}

    saveState();
    render();
    return;

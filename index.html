  const ch = getActiveChar();
  if (e.target.id === "chkT05ShowAll") {
    ch.t05.showAllStages = e.target.checked;
    saveState();
    renderT05Tab();
    return;
  }
  if (e.target.id === "selComp1") {
    ch.t05.componentsFirst = e.target.value;
    const match = findBranchById(ch.t05.componentsFirst);
    ch.t05.leftAmuletBoss = match.boss;
    saveState();
    render();
    return;
  }
  if (e.target.id === "selLeftAmulet") {
    ch.t05.leftAmuletBoss = e.target.value;
    saveState();
    render();
    return;
  }
  if (e.target.id === "selComp2") {
    ch.t05.componentsSecond = e.target.value;
    const match = findBranchById(ch.t05.componentsSecond);
    ch.t05.rightAmuletBoss = match.boss;
    saveState();
    render();
    return;
  }
  if (e.target.id === "selRightAmulet") {
    ch.t05.rightAmuletBoss = e.target.value;
    saveState();
    render();
    return;
  }
  const msId = e.target.getAttribute("data-t05-ms");
  if (msId) {
    ch.t05.milestones[msId] = e.target.checked;
    saveState();
    render();
    return;
  }
  const prereqSlot = e.target.getAttribute("data-t05-prereq");
  if (prereqSlot) {
    ch.t05.prereqT0Owned[prereqSlot] = e.target.checked;
    saveState();
    renderT05Tab();
  }
});

// Party Planner Tab delegated events
function handlePartyPasteSubmit() {
  const input = document.getElementById("partyPasteInput");
  if (!input) return;
  const code = extractShareCode(input.value);
  if (!code) return;
  try {
    const decoded = decodeSharePayload(code);
    const { member, updated } = upsertPartyMemberFromShare(decoded);
    saveState();
    render();
    showToast(updated ? `Updated "${member.playerName}"` : `Added "${member.playerName}"`);
  } catch (err) {
    console.error(err);
    alert("Could not read that share link.");
  }
}

els.partyView.addEventListener("click", async (e) => {
  if (e.target.id === "btnPartyPaste") {
    handlePartyPasteSubmit();
    return;
  }
  if (e.target.id === "btnPartyCopyMyLink") {
    copyShareLink();
    return;
  }
  if (e.target.id === "partySelfActive") {
    state.party.selfScope = "active";
    saveState();
    renderPartyTab();
    return;
  }
  if (e.target.id === "partySelfAll") {
    state.party.selfScope = "all";
    saveState();
    renderPartyTab();
    return;
  }

  const renameBtn = e.target.closest("[data-party-rename]");
  if (renameBtn) {
    const id = renameBtn.getAttribute("data-party-rename");
    const m = state.party.members.find(x => x.id === id);
    if (m) {
      const name = prompt("Rename player:", m.playerName);
      if (name && name.trim()) {
        m.playerName = name.trim();
        saveState();
        renderPartyTab();
      }
    }
    return;
  }

  const removeBtn = e.target.closest("[data-party-remove]");
  if (removeBtn) {
    const id = removeBtn.getAttribute("data-party-remove");
    state.party.members = state.party.members.filter(x => x.id !== id);
    saveState();
    renderPartyTab();
    return;
  }

  const copyPlanBtn = e.target.closest("[data-copy-party-plan]");
  if (copyPlanBtn) {
    const instName = copyPlanBtn.getAttribute("data-copy-party-plan");
    const card = buildPartyDungeonCards().find(c => c.name === instName);
    if (card) {
      const text = formatDiscordDungeonPlan(card, getActivePartyPlayers().length);
      try {
        await navigator.clipboard.writeText(text);
        showToast(`Copied plan for ${card.name}`);
      } catch {
        prompt("Copy Discord plan:", text);
      }
    }
  }
});

els.partyView.addEventListener("keydown", (e) => {
  if (e.target.id === "partyPasteInput" && e.key === "Enter") {
    e.preventDefault();
    handlePartyPasteSubmit();
  }
});

els.partyView.addEventListener("change", (e) => {
  const ch = getActiveChar();
  if (e.target.id === "chkPartyIncludeSelf") {
    state.party.includeSelf = e.target.checked;
    saveState();
    renderPartyTab();
    return;
  }
  if (e.target.id === "partySortSelect") {
    partySort = e.target.value;
    renderPartyTab();
    return;
  }
  if (e.target.id === "chkPartyShowT05") {
    partyShowT05 = e.target.checked;
    renderPartyTab();
    return;
  }
  if (e.target.id === "chkPartyOverlapOnly") {
    partyOverlapOnly = e.target.checked;
    renderPartyTab();
    return;
  }
  if (e.target.id === "chkPartyHideDone") {
    partyHideDone = e.target.checked;
    renderPartyTab();
    return;
  }

  const toggleId = e.target.getAttribute("data-party-toggle");
  if (toggleId) {
    const m = state.party.members.find(x => x.id === toggleId);
    if (m) {
      m.inParty = e.target.checked;
      saveState();
      renderPartyTab();
    }
    return;
  }

  // Own T0.5 quest milestone checkoff (live sync)
  const selfT05 = e.target.getAttribute("data-party-self-t05");
  if (selfT05) {
    ch.t05.milestones[selfT05] = e.target.checked;
    saveState();
    renderPartyTab();
    return;
  }

  // Own item drop checkoff (live sync to Gear Builder & Boss To-Do)
  const selfItemId = e.target.getAttribute("data-party-self-item");
  const selfSetId = e.target.getAttribute("data-party-self-set");
  if (selfItemId && selfSetId) {
    const gs = ch.gearsets.find(s => s.id === selfSetId);
    const item = gs?.items.find(i => i.id === selfItemId);
    if (item) {
      if (item.source === "T0.5") {
        item.t05Status = e.target.checked ? "have_t0" : "need_t0";
        item.obtained = false;
      } else {
        item.obtained = e.target.checked;
      }
      saveState();
      renderPartyTab();
    }
    return;
  }

  // Friend T0.5 quest checkoff (local)
  const friendT05 = e.target.getAttribute("data-party-friend-t05");
  const memberId = e.target.getAttribute("data-party-member-id");
  if (friendT05 && memberId) {
    const m = state.party.members.find(x => x.id === memberId);
    const q = m?.t05Quests.find(x => x.milestoneId === friendT05);
    if (q) {
      q.done = e.target.checked;
      saveState();
      renderPartyTab();
    }
    return;
  }

  // Friend item drop checkoff (local)
  const friendItemId = e.target.getAttribute("data-party-friend-item");
  if (friendItemId && memberId) {
    const m = state.party.members.find(x => x.id === memberId);
    const item = m?.items.find(i => i.id === friendItemId);
    if (item) {
      if (item.source === "T0.5") {
        item.t05Status = e.target.checked ? "have_t0" : "need_t0";
        item.obtained = false;
      } else {
        item.obtained = e.target.checked;
      }
      saveState();
      renderPartyTab();
    }
  }
});

// Compendium events
[els.search, els.instance, els.type, els.coreOnly].forEach(el => {
  el.addEventListener("input", renderCompendiumTab);
  el.addEventListener("change", renderCompendiumTab);
});

els.btnEndgame.addEventListener("click", () => {
  endgameOnly = !endgameOnly;
  els.btnEndgame.classList.toggle("active", endgameOnly);
  populateInstanceDropdown();
  renderCompendiumTab();
});

els.sort.addEventListener("change", () => {
  const v = els.sort.value;
  if (v === "instance_asc") tableSort = { col: "Instance", dir: "asc" };
  else if (v === "instance_desc") tableSort = { col: "Instance", dir: "desc" };
  else if (v === "level_asc") tableSort = { col: "Min_Level", dir: "asc" };
  else if (v === "level_desc") tableSort = { col: "Min_Level", dir: "desc" };
  renderCompendiumTab();
});

els.viewGrouped.addEventListener("click", () => {
  viewMode = "grouped";
  els.viewGrouped.classList.add("active");
  els.viewTable.classList.remove("active");
  renderCompendiumTab();
});

els.viewTable.addEventListener("click", () => {
  viewMode = "table";
  els.viewTable.classList.add("active");
  els.viewGrouped.classList.remove("active");
  renderCompendiumTab();
});

els.expandAll.addEventListener("click", () => {
  getFilteredCompendiumRows().forEach(r => openInstances.add(r.Instance));
  renderCompendiumTab();
});

els.collapseAll.addEventListener("click", () => {
  openInstances.clear();
  renderCompendiumTab();
});

els.resetFilters.addEventListener("click", () => {
  els.search.value = "";
  els.type.value = "";
  els.sort.value = "instance_asc";
  els.coreOnly.checked = false;
  endgameOnly = false;
  els.btnEndgame.classList.remove("active");
  tableSort = { col: "Instance", dir: "asc" };
  populateInstanceDropdown();
  els.instance.value = "";
  renderCompendiumTab();
});

els.compendiumView.addEventListener("click", (e) => {
  const toggleBtn = e.target.closest("[data-toggle]");
  if (toggleBtn) {
    const name = toggleBtn.getAttribute("data-toggle");
    if (openInstances.has(name)) openInstances.delete(name);
    else openInstances.add(name);
    toggleBtn.closest(".instance-card").classList.toggle("open");
    return;
  }
  const sortTh = e.target.closest("th[data-sort-col]");
  if (sortTh) {
    const col = sortTh.getAttribute("data-sort-col");
    if (tableSort.col === col) tableSort.dir = tableSort.dir === "asc" ? "desc" : "asc";
    else tableSort = { col, dir: "asc" };
    renderCompendiumTab();
  }
});

// ============================================================================
// BOOTSTRAP: FETCH LIVE CSV FROM SAME DIRECTORY (GITHUB PAGES / HTTP)
// ============================================================================
async function init() {
  try {
    const res = await fetch(BOSSES_CSV_URL, { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allBosses = parseBossCsv(await res.text());
    if (!allBosses.length) throw new Error("CSV returned 0 rows");
    state = loadState();
    checkIncomingShareHash();
    populateInstanceDropdown();
    render();
  } catch (err) {
    console.error("Failed to load boss CSV:", err);
    els.gearView.innerHTML = `
      <div class="empty-state">
        <h3>Could not load <code>wow_forever_dungeon_bosses.csv</code></h3>
        <p>Serve <code>index.html</code> and <code>wow_forever_dungeon_bosses.csv</code> over HTTP/HTTPS.</p>
      </div>
    `;
  }
}

init();
</script>

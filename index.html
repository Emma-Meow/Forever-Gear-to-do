    const id = cycleBtn.getAttribute("data-cycle-t05");
    const item = gs.items.find(i => i.id === id);
    if (item && item.source === "T0.5") {
      const order = ["need_t0", "have_t0", "t05"];
      const next = order[(order.indexOf(item.t05Status) + 1) % order.length];
      item.t05Status = next;
      item.obtained = next === "t05";
      saveState();
      render();
    }
    return;
  }

  const editItemBtn = e.target.closest("[data-edit-item]");
  if (editItemBtn) {
    const id = editItemBtn.getAttribute("data-edit-item");
    const tr = editItemBtn.closest("tr[data-item-id]");
    const item = gs.items.find(i => i.id === id);
    if (tr && item) {
      editingItemId = id;
      const slotDiv = tr.querySelector(".item-editor-slot");
      slotDiv.innerHTML = `<input type="text" data-gear-field="itemText" value="${esc(item.itemText)}" placeholder="Paste Wowhead link or item name (optional)" />`;
      const input = slotDiv.querySelector("input");
      input.focus();
      input.select();
    }
    return;
  }

  const delBtn = e.target.closest("[data-delete-item]");
  if (delBtn) {
    const id = delBtn.getAttribute("data-delete-item");
    gs.items = gs.items.filter(i => i.id !== id);
    saveState();
    render();
  }
});

els.gearView.addEventListener("change", (e) => {
  const ch = getActiveChar();
  const gs = getActiveSet();
  if (e.target.id === "gearsetSelect") {
    ch.activeSetId = e.target.value;
    saveState();
    render();
    return;
  }
  if (e.target.id === "gearSourceFilter") {
    gearSourceFilter = e.target.value;
    renderGearTab();
    return;
  }
  if (e.target.id === "chkGearHideObtained") {
    gearHideObtained = e.target.checked;
    renderGearTab();
    return;
  }
  const tr = e.target.closest("tr[data-item-id]");
  const field = e.target.getAttribute("data-gear-field");
  if (!tr || !field || field === "itemText") return;
  const item = gs.items.find(i => i.id === tr.getAttribute("data-item-id"));
  if (!item) return;

  if (field === "obtained") {
    item.obtained = e.target.checked;
  } else if (field === "source") {
    const prevSource = item.source;
    item.source = e.target.value;
    if (item.source === "T0.5") {
      item.t05Status = item.obtained ? "t05" : "need_t0";
      item.obtained = item.t05Status === "t05";
    } else {
      if (prevSource === "T0.5") item.obtained = item.t05Status === "t05";
      if (item.source !== "Dungeon") {
        item.dungeon = "";
        item.boss = "";
      }
    }
  } else if (field === "dungeon") {
    item.dungeon = e.target.value;
    item.boss = "";
  } else if (field === "boss") {
    item.boss = e.target.value;
  } else if (field === "slot") {
    item.slot = e.target.value;
  }
  saveState();
  render();
});

els.gearView.addEventListener("input", (e) => {
  const gs = getActiveSet();
  if (e.target.id === "gearBookmarkInput") {
    gs.bookmarkUrl = e.target.value;
    saveState();
    const existing = document.getElementById("bookmarkOpenLink");
    const valid = isUrl(gs.bookmarkUrl);
    if (valid && existing) {
      existing.href = gs.bookmarkUrl.trim();
    } else if (valid !== Boolean(existing)) {
      const row = e.target.parentElement;
      if (valid) {
        const a = document.createElement("a");
        a.id = "bookmarkOpenLink";
        a.className = "link-btn";
        a.href = gs.bookmarkUrl.trim();
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = "Open Bookmark ↗";
        row.appendChild(a);
      } else if (existing) {
        existing.remove();
      }
    }
    return;
  }
  if (e.target.getAttribute("data-gear-field") === "itemText") {
    const tr = e.target.closest("tr[data-item-id]");
    const item = tr && gs.items.find(i => i.id === tr.getAttribute("data-item-id"));
    if (item) {
      item.itemText = e.target.value;
      saveState();
      const linkEl = tr.querySelector("[data-item-open-link]");
      if (linkEl) {
        const valid = isUrl(item.itemText);
        linkEl.classList.toggle("hidden", !valid);
        linkEl.href = valid ? item.itemText.trim() : "#";
      }
    }
  }
});

els.gearView.addEventListener("focusout", (e) => {
  if (e.target.getAttribute("data-gear-field") !== "itemText") return;
  const gs = getActiveSet();
  const tr = e.target.closest("tr[data-item-id]");
  const item = tr && gs.items.find(i => i.id === tr.getAttribute("data-item-id"));
  if (!item) return;

  item.itemText = e.target.value.trim();
  editingItemId = null;
  saveState();

  const linkEl = tr.querySelector("[data-item-open-link]");
  if (linkEl) {
    const valid = isUrl(item.itemText);
    linkEl.classList.toggle("hidden", !valid);
    linkEl.href = valid ? item.itemText : "#";
  }

  const wowheadName = parseWowheadItemUrl(item.itemText);
  if (wowheadName) {
    const slotDiv = tr.querySelector(".item-editor-slot");
    slotDiv.innerHTML = `<button type="button" class="item-display-btn" data-edit-item="${esc(item.id)}" title="Click to edit Wowhead URL">${esc(wowheadName)}</button>`;
  }
});

els.gearView.addEventListener("keydown", (e) => {
  if (e.target.getAttribute("data-gear-field") === "itemText" && (e.key === "Enter" || e.key === "Escape")) {
    e.target.blur();
  }
});

// Boss To-Do Tab delegated events
els.todoView.addEventListener("click", (e) => {
  if (e.target.id === "btnGoGearBuilder") { activeTab = "gear"; render(); return; }
  if (e.target.id === "scopeActive") { todoScope = "active"; render(); return; }
  if (e.target.id === "scopeAll") { todoScope = "all"; render(); return; }
});

els.todoView.addEventListener("change", (e) => {
  const ch = getActiveChar();
  if (e.target.id === "todoSortSelect") { todoSort = e.target.value; renderTodoTab(); return; }
  if (e.target.id === "chkTodoHideDone") { todoHideDone = e.target.checked; renderTodoTab(); return; }
  if (e.target.id === "chkShowT05Quests") { showT05QuestBosses = e.target.checked; render(); return; }

  const msId = e.target.getAttribute("data-todo-t05-ms");
  if (msId) {
    ch.t05.milestones[msId] = e.target.checked;
    saveState();
    render();
    return;
  }

  const itemId = e.target.getAttribute("data-todo-item-id");
  const setId = e.target.getAttribute("data-todo-set-id");
  if (itemId && setId) {
    const gs = ch.gearsets.find(s => s.id === setId);
    const item = gs?.items.find(i => i.id === itemId);
    if (item) {
      if (item.source === "T0.5") {
        item.t05Status = e.target.checked ? "have_t0" : "need_t0";
        item.obtained = false;
      } else {
        item.obtained = e.target.checked;
      }
      saveState();
      render();
    }
  }
});

// T0.5 Chain Tab delegated events
els.t05View.addEventListener("click", (e) => {
  const ch = getActiveChar();
  const upgBtn = e.target.closest("[data-upgrade-stage]");
  if (upgBtn) {
    const stageNum = parseInt(upgBtn.getAttribute("data-upgrade-stage"), 10);
    const stageObj = buildT05Stages(ch).find(s => s.stage === stageNum);
    if (stageObj) {
      let count = 0;
      for (const { item } of getCharacterT05Items(ch)) {
        if (stageObj.slots.includes(item.slot) && item.t05Status !== "t05") {
          item.t05Status = "t05";
          item.obtained = true;
          count++;
        }
      }
      const turninMs = stageObj.milestones[stageObj.milestones.length - 1];
      if (turninMs) ch.t05.milestones[turninMs.id] = true;
      saveState();
      render();
      showToast(`Marked ${count} Stage ${stageNum} piece(s) as T0.5 ✓`);
    }
  }
});

els.t05View.addEventListener("change", (e) => {
  const ch = getActiveChar();
  if (e.target.id === "chkT05ShowAll") {
    ch.t05.showAllStages = e.target.checked;
    saveState();
    renderT05Tab();
    return;
  }
  if (e.target.id === "selComp1") {
    ch.t05.componentsFirst = e.target.value;
    const match = findBranchById(ch.t05.componentsFirst);
    ch.t05.leftAmuletBoss = match.boss;
    saveState();
    render();
    showToast(`Components #1 & Left Piece set to ${match.boss}`);
    return;
  }
  if (e.target.id === "selLeftAmulet") {
    ch.t05.leftAmuletBoss = e.target.value;
    saveState();
    render();
    showToast(`Left Piece boss set to ${ch.t05.leftAmuletBoss}`);
    return;
  }
  if (e.target.id === "selComp2") {
    ch.t05.componentsSecond = e.target.value;
    const match = findBranchById(ch.t05.componentsSecond);
    ch.t05.rightAmuletBoss = match.boss;
    saveState();
    render();
    showToast(`More Components & Right Piece set to ${match.boss}`);
    return;
  }
  if (e.target.id === "selRightAmulet") {
    ch.t05.rightAmuletBoss = e.target.value;
    saveState();
    render();
    showToast(`Right Piece boss set to ${ch.t05.rightAmuletBoss}`);
    return;
  }
  const msId = e.target.getAttribute("data-t05-ms");
  if (msId) {
    ch.t05.milestones[msId] = e.target.checked;
    saveState();
    render();
    return;
  }
  const prereqSlot = e.target.getAttribute("data-t05-prereq");
  if (prereqSlot) {
    ch.t05.prereqT0Owned[prereqSlot] = e.target.checked;
    saveState();
    renderT05Tab();
  }
});

// Compendium events
[els.search, els.instance, els.type, els.coreOnly].forEach(el => {
  el.addEventListener("input", renderCompendiumTab);
  el.addEventListener("change", renderCompendiumTab);
});

els.btnEndgame.addEventListener("click", () => {
  endgameOnly = !endgameOnly;
  els.btnEndgame.classList.toggle("active", endgameOnly);
  populateInstanceDropdown();
  renderCompendiumTab();
});

els.sort.addEventListener("change", () => {
  const v = els.sort.value;
  if (v === "instance_asc") tableSort = { col: "Instance", dir: "asc" };
  else if (v === "instance_desc") tableSort = { col: "Instance", dir: "desc" };
  else if (v === "level_asc") tableSort = { col: "Min_Level", dir: "asc" };
  else if (v === "level_desc") tableSort = { col: "Min_Level", dir: "desc" };
  renderCompendiumTab();
});

els.viewGrouped.addEventListener("click", () => {
  viewMode = "grouped";
  els.viewGrouped.classList.add("active");
  els.viewTable.classList.remove("active");
  renderCompendiumTab();
});

els.viewTable.addEventListener("click", () => {
  viewMode = "table";
  els.viewTable.classList.add("active");
  els.viewGrouped.classList.remove("active");
  renderCompendiumTab();
});

els.expandAll.addEventListener("click", () => {
  getFilteredCompendiumRows().forEach(r => openInstances.add(r.Instance));
  renderCompendiumTab();
});

els.collapseAll.addEventListener("click", () => {
  openInstances.clear();
  renderCompendiumTab();
});

els.resetFilters.addEventListener("click", () => {
  els.search.value = "";
  els.type.value = "";
  els.sort.value = "instance_asc";
  els.coreOnly.checked = false;
  endgameOnly = false;
  els.btnEndgame.classList.remove("active");
  tableSort = { col: "Instance", dir: "asc" };
  populateInstanceDropdown();
  els.instance.value = "";
  renderCompendiumTab();
});

els.compendiumView.addEventListener("click", (e) => {
  const toggleBtn = e.target.closest("[data-toggle]");
  if (toggleBtn) {
    const name = toggleBtn.getAttribute("data-toggle");
    if (openInstances.has(name)) openInstances.delete(name);
    else openInstances.add(name);
    toggleBtn.closest(".instance-card").classList.toggle("open");
    return;
  }
  const sortTh = e.target.closest("th[data-sort-col]");
  if (sortTh) {
    const col = sortTh.getAttribute("data-sort-col");
    if (tableSort.col === col) tableSort.dir = tableSort.dir === "asc" ? "desc" : "asc";
    else tableSort = { col, dir: "asc" };
    renderCompendiumTab();
  }
});

// ============================================================================
// BOOTSTRAP: FETCH LIVE CSV FROM SAME DIRECTORY (GITHUB PAGES / HTTP)
// ============================================================================
async function init() {
  try {
    const res = await fetch(BOSSES_CSV_URL, { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allBosses = parseBossCsv(await res.text());
    if (!allBosses.length) throw new Error("CSV returned 0 rows");
    state = loadState();
    checkIncomingShareHash();
    populateInstanceDropdown();
    render();
  } catch (err) {
    console.error("Failed to load boss CSV:", err);
    els.gearView.innerHTML = `
      <div class="empty-state">
        <h3>Could not load <code>wow_forever_dungeon_bosses.csv</code></h3>
        <p style="max-width:540px;margin:0 auto;">
          Make sure both <code>index.html</code> and <code>wow_forever_dungeon_bosses.csv</code> are in the same folder and served over HTTP/HTTPS (such as GitHub Pages).
        </p>
      </div>
    `;
  }
}

init();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dungeon To-Do</title>
<style>
  :root {
    /* Wowhead-sampled neutral dark grays */
    --bg: #101010;
    --surface: #181818;
    --surface-2: #202020;
    --surface-deep: #141414;
    --hover: #242424;
    --border: #2d2d2d;
    --border-strong: #3d3d3d;

    /* Crisp Wowhead foreground hierarchy */
    --text: #e6e6e6;
    --text-strong: #ffffff;
    --muted: #8f8f8f;
    --subtle: #666666;

    /* WoW Forever sampled steel-cerulean blues */
    --forever: #175b8c;
    --forever-hover: #1e6ea8;
    --forever-bright: #5db2e8;
    --forever-text: #8ccbf2;
    --forever-tint: rgba(23, 91, 140, 0.22);
    --forever-tint-soft: rgba(23, 91, 140, 0.12);
    --forever-border: #2874ab;

    /* Semantic tones */
    --success: #3fb950;
    --success-tint: rgba(63, 185, 80, 0.14);
    --danger: #d9534f;
    --danger-tint: rgba(217, 83, 79, 0.14);

    /* Boss type colors */
    --type-main: #c8c8c8;
    --type-final: #e06c75;
    --type-rare: #b77ced;
    --type-secret: #d97cb5;
    --type-summoned: #4ec2b4;
    --type-optional: #969696;
    --type-event: #78a9d6;

    --radius: 4px;
    --radius-sm: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 13.5px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.42;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px 0;
  }

  .wrap {
    max-width: 1380px;
    margin: 0 auto;
  }

  .title-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  h1 {
    margin: 0;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-strong);
    letter-spacing: -0.1px;
  }

  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  /* Prominent Character Bar */
  .char-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
    padding: 8px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-left: 3px solid var(--forever);
    border-radius: var(--radius-sm);
  }

  .char-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--forever-text);
  }

  .faction-btn {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 4px 8px;
  }

  .faction-btn.horde {
    color: #e88388;
    background: rgba(217, 83, 79, 0.14);
    border-color: rgba(217, 83, 79, 0.38);
  }

  .faction-btn.alliance {
    color: var(--forever-text);
    background: var(--forever-tint);
    border-color: var(--forever-border);
  }

  /* Top-level Tabs */
  .main-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 12px;
  }

  .tab-btn {
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    padding: 8px 16px;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    position: relative;
    bottom: -1px;
    cursor: pointer;
  }

  .tab-btn:hover {
    color: var(--text-strong);
    background: var(--surface-2);
    border-color: var(--border-strong);
  }

  .tab-btn.active {
    background: var(--bg);
    color: var(--text-strong);
    border-color: var(--border);
    box-shadow: inset 0 2px 0 var(--forever);
  }

  /* Form controls */
  button, select, input[type="search"], input[type="text"], input[type="url"] {
    font: inherit;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    outline: none;
    transition: border-color 0.12s, background 0.12s;
  }

  button {
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 500;
  }

  button:hover, select:hover, input:hover {
    border-color: var(--border-strong);
    background-color: var(--hover);
  }

  input:hover {
    background-color: var(--surface-deep);
  }

  button:focus, select:focus, input:focus {
    border-color: var(--forever-bright);
  }

  select:disabled, input:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    background: var(--surface-deep);
  }

  button.primary {
    background: var(--forever);
    border-color: var(--forever-border);
    color: #ffffff;
    font-weight: 600;
  }

  button.primary:hover {
    background: var(--forever-hover);
    border-color: var(--forever-bright);
  }

  button.danger {
    color: #ef8a87;
    border-color: rgba(217, 83, 79, 0.4);
    background: var(--danger-tint);
  }

  button.danger:hover {
    background: rgba(217, 83, 79, 0.24);
    border-color: var(--danger);
  }

  button.toggle-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  button.toggle-pill.active {
    background: var(--forever);
    border-color: var(--forever-border);
    color: #ffffff;
    font-weight: 600;
  }

  button.toggle-pill.active:hover {
    background: var(--forever-hover);
  }

  /* 3-State T0.5 Status Pill in Gear Builder */
  .t05-state-btn {
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 700;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    min-width: 62px;
    text-align: center;
  }

  .t05-state-btn.need_t0 {
    background: var(--surface-deep);
    color: var(--muted);
    border-color: var(--border-strong);
  }

  .t05-state-btn.have_t0 {
    background: var(--forever-tint);
    color: var(--forever-text);
    border-color: var(--forever-border);
  }

  .t05-state-btn.t05 {
    background: var(--success-tint);
    color: var(--success);
    border-color: rgba(63, 185, 80, 0.45);
  }

  /* Sticky Compendium Controls */
  .controls-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface-deep);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
  }

  .controls-grid {
    display: grid;
    grid-template-columns: minmax(220px, 2.2fr) minmax(190px, 1.3fr) minmax(150px, 1fr) minmax(170px, 1fr);
    gap: 6px;
    align-items: center;
  }

  .controls-row-2 {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
  }

  .segmented {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 2px;
    gap: 2px;
  }

  .segmented button {
    border: none;
    background: transparent;
    padding: 5px 10px;
    border-radius: 2px;
    color: var(--muted);
  }

  .segmented button:hover {
    color: var(--text);
    background: var(--surface-2);
  }

  .segmented button.active {
    background: var(--forever);
    color: #ffffff;
    font-weight: 600;
  }

  .inline-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .item-count-tag {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
    margin-right: 4px;
  }

  .item-count-tag strong {
    color: var(--text-strong);
  }

  label.chk {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    padding: 4px 6px;
  }

  label.chk:hover { color: var(--text); }
  label.chk input[type="checkbox"] { accent-color: var(--forever); cursor: pointer; }

  main {
    padding: 14px 20px 48px;
  }

  /* Utilitarian tags */
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: var(--radius-sm);
    letter-spacing: 0.2px;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .type-Main { background: var(--surface-2); color: var(--type-main); border-color: var(--border); }
  .type-Final { background: rgba(224, 108, 117, 0.14); color: var(--type-final); border-color: rgba(224, 108, 117, 0.35); }
  .type-Rare { background: rgba(183, 124, 237, 0.14); color: var(--type-rare); border-color: rgba(183, 124, 237, 0.35); }
  .type-Secret { background: rgba(217, 124, 181, 0.14); color: var(--type-secret); border-color: rgba(217, 124, 181, 0.35); }
  .type-Summoned { background: rgba(78, 194, 180, 0.14); color: var(--type-summoned); border-color: rgba(78, 194, 180, 0.32); }
  .type-Optional { background: var(--surface-deep); color: var(--type-optional); border-color: var(--border); }
  .type-Event { background: rgba(120, 169, 214, 0.14); color: var(--type-event); border-color: rgba(120, 169, 214, 0.32); }

  .accent-badge {
    background: var(--forever-tint);
    color: var(--forever-text);
    border-color: var(--forever-border);
  }

  .muted-badge {
    background: var(--surface-deep);
    color: var(--muted);
    border-color: var(--border);
  }

  .done-tag {
    background: var(--success-tint);
    color: var(--success);
    border-color: rgba(63, 185, 80, 0.35);
  }

  .t05-quest-tag {
    background: rgba(78, 194, 180, 0.16);
    color: var(--type-summoned);
    border: 1px solid rgba(78, 194, 180, 0.38);
    border-radius: 2px;
    padding: 0 5px;
    font-size: 11px;
    font-weight: 700;
  }

  .base-t0-tag {
    background: var(--surface-2);
    color: var(--forever-text);
    border: 1px solid var(--forever-border);
    border-radius: 2px;
    padding: 0 5px;
    font-size: 10.5px;
    font-weight: 600;
  }

  /* Panels */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 10px;
  }

  .gearset-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .bookmark-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
  }

  .bookmark-row label {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
  }

  .bookmark-row input {
    flex: 1 1 320px;
    font-size: 0.82rem;
    background: var(--surface-deep);
  }

  a.link-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--forever-border);
    background: var(--forever);
    color: #ffffff;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }

  a.link-btn:hover { background: var(--forever-hover); }

  a.inline-link {
    color: var(--forever-text);
    text-decoration: none;
    font-size: 0.8rem;
    padding: 4px 7px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--forever-border);
    background: var(--forever-tint);
    white-space: nowrap;
  }

  a.inline-link:hover { background: var(--forever); color: #ffffff; }

  .item-cell-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 220px;
  }

  .item-editor-slot {
    flex: 1 1 auto;
    min-width: 0;
  }

  .item-cell-wrap input {
    width: 100%;
    padding: 5px 8px;
    font-size: 0.82rem;
    background: var(--surface-deep);
  }

  .item-display-btn {
    width: 100%;
    text-align: left;
    padding: 5px 8px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-strong);
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: text;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }

  .item-display-btn:hover {
    border-color: var(--forever-border);
    background: var(--surface-2);
  }

  .gear-table select {
    padding: 5px 7px;
    font-size: 0.82rem;
    width: 100%;
    min-width: 110px;
  }

  .gear-table td.col-dungeon select { min-width: 175px; }
  .gear-table td.col-boss select { min-width: 185px; }
  .gear-table td.col-source select { min-width: 108px; }
  .gear-table td.col-slot select { min-width: 108px; }

  /* Dungeon & Stage Cards */
  .instance-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .instance-card.has-active { border-left: 3px solid var(--forever); }

  .instance-header {
    width: 100%;
    text-align: left;
    background: var(--surface-2);
    border: none;
    border-radius: 0;
    padding: 8px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
  }

  .instance-header:hover { background: var(--hover); }

  .instance-header.static {
    cursor: default;
    background: var(--surface-deep);
  }

  .instance-header.static:hover {
    background: var(--surface-deep);
  }

  .inst-left {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .chevron {
    display: inline-block;
    width: 14px;
    color: var(--muted);
    transition: transform 0.12s ease;
    font-size: 0.72rem;
  }

  .instance-card.open .chevron {
    transform: rotate(90deg);
    color: var(--forever-bright);
  }

  .inst-name {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-strong);
  }

  .inst-meta {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .instance-body {
    display: none;
    border-top: 1px solid var(--border);
  }

  .instance-card.open .instance-body { display: block; }

  .wing-banner {
    background: var(--surface-deep);
    color: var(--forever-text);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 5px 14px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  /* T0.5 Chain Specific Styles */
  .t05-stage-body {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .t05-turnin-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  .t05-turnin-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.45px;
    color: var(--muted);
    margin-right: 4px;
  }

  .t05-piece-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 0.8rem;
  }

  .t05-piece-chip.ready {
    border-color: var(--forever-border);
    background: var(--forever-tint-soft);
  }

  .t05-piece-chip.upgraded {
    border-color: rgba(63, 185, 80, 0.4);
    background: var(--success-tint);
    color: var(--success);
  }

  .t05-piece-chip input[type="checkbox"] {
    accent-color: var(--forever);
    cursor: pointer;
    margin: 0;
  }

  .t05-milestones {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .t05-milestone-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 10px;
    background: var(--surface-deep);
    border: 1px solid #242424;
    border-radius: var(--radius-sm);
    font-size: 0.84rem;
  }

  .t05-milestone-row.done { opacity: 0.52; }
  .t05-milestone-row.done .ms-title { text-decoration: line-through; }

  .t05-milestone-row input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--forever);
    cursor: pointer;
    margin: 2px 0 0;
    flex-shrink: 0;
  }

  .ms-content {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 8px;
    flex: 1 1 auto;
    min-width: 0;
  }

  .ms-title { font-weight: 600; color: var(--text-strong); }
  .ms-detail { color: var(--muted); font-size: 0.8rem; }

  .t05-amulet-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(240px, 1fr));
    gap: 8px;
    padding: 8px 10px;
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  @media (max-width: 720px) {
    .t05-amulet-grid { grid-template-columns: 1fr; }
  }

  .t05-amulet-picker {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .t05-amulet-picker label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.4px;
  }

  details.t05-mats {
    background: var(--surface-deep);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
  }

  details.t05-mats summary {
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--forever-text);
    user-select: none;
  }

  details.t05-mats ul {
    margin: 8px 0 4px;
    padding-left: 18px;
    color: var(--muted);
    font-size: 0.81rem;
  }

  details.t05-mats li { margin-bottom: 3px; }
  details.t05-mats strong { color: var(--text); }

  /* Tables */
  .table-wrap {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .instance-body .table-wrap {
    border: none;
    border-radius: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84rem;
  }

  th, td {
    padding: 7px 10px;
    text-align: left;
    border-bottom: 1px solid #242424;
    vertical-align: middle;
  }

  th {
    background: var(--surface-deep);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.45px;
    font-weight: 700;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }

  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover, th.sorted { color: var(--forever-text); }

  tr:last-child td { border-bottom: none; }
  tbody tr { background: var(--surface); }
  tbody tr:nth-child(even) { background: #161616; }
  tbody tr:hover { background: var(--hover); }
  tbody tr.row-obtained { opacity: 0.48; }
  tbody tr.row-obtained .boss-name { text-decoration: line-through; }
  tbody tr.row-targeted { background: var(--forever-tint-soft); }
  tbody tr.row-targeted:hover { background: var(--forever-tint); }

  .check-cell {
    width: 78px;
    text-align: center;
  }

  .check-cell input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--forever);
    cursor: pointer;
    vertical-align: middle;
    margin: 0;
  }

  .boss-name {
    font-weight: 600;
    color: var(--text-strong);
  }

  .todo-table, .comp-table {
    table-layout: fixed;
    min-width: 780px;
  }

  .todo-table th, .todo-table td,
  .comp-table th, .comp-table td {
    text-align: left;
  }

  .notes-cell {
    color: var(--muted);
    font-size: 0.8rem;
  }

  .remove-btn {
    padding: 3px 7px;
    font-size: 0.78rem;
    color: var(--muted);
    background: transparent;
    border-color: transparent;
  }

  .remove-btn:hover {
    color: #ef8a87;
    border-color: rgba(217, 83, 79, 0.4);
    background: var(--danger-tint);
  }

  /* To-Do item rows inside a boss cell */

    border-radius: var(--radius-sm);
    padding: 5px 8px;
    font-size: 0.8rem;
  }

    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    flex: 1 1 auto;
    min-width: 0;
  }

  .drop-chip.done {
    opacity: 0.5;
    text-decoration: line-through;
  }

    width: 14px;
    height: 14px;
    accent-color: var(--forever);

    margin: 2px 0 0;
    flex-shrink: 0;

    padding: 0 5px;
    font-size: 11px;
    font-weight: 600;

    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0 5px;
    font-size: 11px;
    font-weight: 600;
  }

  .empty-state {
    text-align: center;
    padding: 42px 20px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);

  .party-paste-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .party-paste-row input {
    flex: 1 1 280px;
    font-size: 0.82rem;
    background: var(--surface-deep);
  }

  .roster-wrap {
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }

  .roster-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.83rem;
  }

  .roster-table td {
    padding: 6px 10px;
    border-bottom: 1px solid #242424;
    vertical-align: middle;
  }

  .roster-table tr:last-child td { border-bottom: none; }

  .roster-chk-cell {
    width: 38px;
    text-align: center;
  }

  .roster-chk-cell input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--forever);
    cursor: pointer;
    vertical-align: middle;
    margin: 0;

  .player-tag {
    background: var(--surface-2);
    color: var(--text-strong);
    border: 1px solid var(--border-strong);
    border-radius: 2px;
    padding: 0 5px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .player-tag.self {

    color: var(--forever-text);

  }

  .overlap-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 4px;
  }

  .overlap-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;

  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0, 0, 0, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-card {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 16px;
  }

  .modal-card h3 {

    font-size: 0.98rem;
    color: var(--text-strong);
  }

  .modal-summary {
    margin: 0 0 14px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .modal-summary strong { color: var(--text-strong); }

  .modal-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
  }

  .toast {
    position: fixed;

    pointer-events: none;
    transition: opacity 0.18s ease;
  }

  .toast.show { opacity: 1; }

  .hidden { display: none !important; }

  @media (max-width: 920px) {
    .controls-grid { grid-template-columns: 1fr 1fr; }
    .controls-grid input[type="search"] { grid-column: 1 / -1; }

    id: uid(),
    name,
    faction: faction === "Alliance" ? "Alliance" : "Horde",
    activeSetId: sets[0].id,
    gearsets: sets,
    t05: createDefaultT05State(),
  };
}

function normalizeItem(item) {
  const src = SOURCES.includes(item.source) ? item.source : "Dungeon";
  let t05Status = item.t05Status;
  if (!["need_t0", "have_t0", "t05"].includes(t05Status)) {
    t05Status = item.obtained ? "t05" : "need_t0";
  }
  const obtained = src === "T0.5" ? t05Status === "t05" : Boolean(item.obtained);
  let dungeon = String(item.dungeon || "");
  const boss = String(item.boss || "");
  if ((dungeon === "Blackrock Spire" || dungeon === "Dire Maul") && boss && allBosses.length) {
    const match = allBosses.find(b => b.Boss_Name === boss && b.Instance.startsWith(dungeon + ":"));
    if (match) dungeon = match.Instance;
  }
  return {
    id: item.id || uid(),
    obtained,
    t05Status,
    slot: SLOTS.includes(item.slot) ? item.slot : "Head",
    source: src,
    dungeon,
    boss,
    itemText: String(item.itemText || ""),
  };
}

function normalizeCharacter(c) {
  const gearsets = (Array.isArray(c.gearsets) && c.gearsets.length ? c.gearsets : [createDefaultGearset()]).map(gs => ({
    id: gs.id || uid(),
    name: String(gs.name || "Pre-BiS Set"),
    bookmarkUrl: String(gs.bookmarkUrl || ""),
    items: (Array.isArray(gs.items) ? gs.items : []).map(normalizeItem),
  }));
  const activeSetId = gearsets.some(g => g.id === c.activeSetId) ? c.activeSetId : gearsets[0].id;
  const t05Raw = c.t05 || {};
  const leftBranch = findBranchByBoss(t05Raw.leftAmuletBoss, "scholomance");
  const rightBranch = findBranchByBoss(t05Raw.rightAmuletBoss, "dme");
  return {
    id: c.id || uid(),
    name: String(c.name || "Main"),
    faction: c.faction === "Alliance" ? "Alliance" : "Horde",
    activeSetId,
    gearsets,
    t05: {
      milestones: t05Raw.milestones && typeof t05Raw.milestones === "object" ? { ...t05Raw.milestones } : {},
      prereqT0Owned: t05Raw.prereqT0Owned && typeof t05Raw.prereqT0Owned === "object" ? { ...t05Raw.prereqT0Owned } : {},
      componentsFirst: T05_AMULET_BRANCHES.some(b => b.id === t05Raw.componentsFirst) ? t05Raw.componentsFirst : leftBranch.id,
      leftAmuletBoss: leftBranch.boss,
      componentsSecond: T05_AMULET_BRANCHES.some(b => b.id === t05Raw.componentsSecond) ? t05Raw.componentsSecond : rightBranch.id,
      rightAmuletBoss: rightBranch.boss,
      showAllStages: Boolean(t05Raw.showAllStages),
    },
  };
}

function normalizePartyMember(m) {
  const items = (Array.isArray(m.items) ? m.items : []).map(normalizeItem);
  const t05Quests = (Array.isArray(m.t05Quests) ? m.t05Quests : [])
    .filter(q => q && q.dungeon && q.boss)
    .map(q => ({
      milestoneId: String(q.milestoneId || uid()),
      stage: parseInt(q.stage, 10) || 1,
      dungeon: String(q.dungeon),
      boss: String(q.boss),
      title: String(q.title || "T0.5 Quest"),
      done: Boolean(q.done),
    }));
  return {
    id: m.id || uid(),
    playerName: String(m.playerName || m.setName || "Friend").trim(),
    setName: String(m.setName || "Pre-BiS").trim(),
    inParty: m.inParty !== false,
    updatedAt: String(m.updatedAt || ""),
    items,
    t05Quests,
  };
}

function normalizeParty(rawParty) {
  const p = rawParty && typeof rawParty === "object" ? rawParty : {};
  return {
    includeSelf: p.includeSelf !== false,
    selfScope: p.selfScope === "all" ? "all" : "active",
    members: Array.isArray(p.members) ? p.members.map(normalizePartyMember) : [],
  };
}

function migrateToV2(raw) {
  if (raw && raw.version === 2 && Array.isArray(raw.characters) && raw.characters.length) {
    const characters = raw.characters.map(normalizeCharacter);
    const activeCharId = characters.some(c => c.id === raw.activeCharId) ? raw.activeCharId : characters[0].id;
    return { version: 2, activeCharId, characters, party: normalizeParty(raw.party) };
  }
  if (raw && Array.isArray(raw.gearsets) && raw.gearsets.length) {
    const migratedChar = normalizeCharacter({
      id: uid(),
      name: "Main",
      faction: "Horde",
      activeSetId: raw.activeSetId,
      gearsets: raw.gearsets,
    });
    return { version: 2, activeCharId: migratedChar.id, characters: [migratedChar], party: normalizeParty(null) };
  }
  const first = createCharacter("Main", "Horde");
  return { version: 2, activeCharId: first.id, characters: [first], party: normalizeParty(null) };
}

function loadState() {
  try {
    const v2 = JSON.parse(localStorage.getItem(STORAGE_KEY_V2) || "null");
    if (v2) return migrateToV2(v2);
    const v1 = JSON.parse(localStorage.getItem(STORAGE_KEY_V1) || "null");
    if (v1) {
      const migrated = migrateToV2(v1);
      localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(migrated));
      return migrated;
    }
  } catch {}
  return migrateToV2(null);
}

function saveState() {
  localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(state));
}

function getActiveChar() {
  return state.characters.find(c => c.id === state.activeCharId) || state.characters[0];
}

function getActiveSet() {
  const ch = getActiveChar();
  return ch.gearsets.find(g => g.id === ch.activeSetId) || ch.gearsets[0];
}

function esc(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function isEndgame(r) {
  return r.Min_Level >= 50;
}

function isUrl(str) {
  return /^https?:\/\//i.test(String(str || "").trim());
}

const LOWERCASE_WORDS = new Set(["a", "an", "and", "at", "by", "for", "from", "in", "of", "on", "or", "the", "to", "with"]);

function parseWowheadItemUrl(str) {
  const s = String(str || "").trim();
  if (!isUrl(s)) return null;
  let parsed;
  try {
    parsed = new URL(s);
  } catch {
    return null;
  }
  const host = parsed.hostname.toLowerCase();
  if (host !== "wowhead.com" && !host.endsWith(".wowhead.com")) return null;

  const m = parsed.pathname.match(/\/item=(\d+)(?:\/([^/?#]+))?/i);
  if (!m) return null;

  const itemId = m[1];
  const slug = m[2];
  if (slug) {
    const words = decodeURIComponent(slug).replace(/[-_]+/g, " ").trim().split(/\s+/);
    const title = words.map((w, idx) => {
      const lower = w.toLowerCase();
      if (idx > 0 && LOWERCASE_WORDS.has(lower)) return lower;
      return lower.charAt(0).toUpperCase() + lower.slice(1);
    }).join(" ");
    if (title) return title;
  }
  return `Item #${itemId}`;
}

function extractWowheadItemId(str) {
  const s = String(str || "").trim();
  if (!isUrl(s)) return null;
  try {
    const parsed = new URL(s);
    const host = parsed.hostname.toLowerCase();
    if (host !== "wowhead.com" && !host.endsWith(".wowhead.com")) return null;
    const m = parsed.pathname.match(/\/item=(\d+)/i);
    return m ? m[1] : null;
  } catch {
    return null;
  }
}

function shortLabelForItem(str) {
  const s = String(str || "").trim();
  if (!s) return "";
  const wh = parseWowheadItemUrl(s);
  if (wh) return wh;
  if (isUrl(s)) return "Item Link";
  return s;
}

function isItemDoneForBossTodo(item) {
  if (item.source === "T0.5") {
    return item.t05Status === "have_t0" || item.t05Status === "t05";
  }
  return Boolean(item.obtained);
}

function getCharacterT05Items(char) {
  const list = [];
  for (const gs of char.gearsets) {
    for (const item of gs.items) {
      if (item.source === "T0.5") list.push({ gearset: gs, item });
    }
  }
  return list;
}

function getMaxRequiredT05Stage(char) {
  const t05Items = getCharacterT05Items(char);
  if (!t05Items.length) return 0;
  let maxStage = 1;
  for (const { item } of t05Items) {
    const st = T05_SLOT_STAGE[item.slot];
    if (st && st > maxStage) maxStage = st;
  }
  return maxStage;
}

function getDungeonCatalog(onlyEndgame) {
  const map = new Map();
  for (const r of allBosses) {
    if (onlyEndgame && !isEndgame(r)) continue;
    if (!map.has(r.Instance)) {
      map.set(r.Instance, {
        name: r.Instance,
        minLevel: r.Min_Level,
        maxLevel: r.Max_Level,
        bosses: [],
      });
    }
    map.get(r.Instance).bosses.push(r);
  }
  for (const d of map.values()) {
    d.bosses.sort((a, b) => a.Boss_Order - b.Boss_Order);
  }
  return map;
}

function getBossRecord(dungeon, bossName) {
  return allBosses.find(b => b.Instance === dungeon && b.Boss_Name === bossName) || null;
}

function getDerivedTargets(scope, includeT05Quests = true) {
  const ch = getActiveChar();
  const sets = scope === "all" ? ch.gearsets : [getActiveSet()];
  const entries = [];

  for (const gs of sets) {
    for (const item of gs.items) {
      if ((item.source === "Dungeon" || item.source === "T0.5") && item.dungeon && item.boss) {
        entries.push({
          kind: "item",
          gearsetId: gs.id,
          gearsetName: gs.name,
          dungeon: item.dungeon,
          boss: item.boss,
          done: isItemDoneForBossTodo(item),
          item,
          bossRec: getBossRecord(item.dungeon, item.boss),
        });
      }
    }
  }

  const maxStage = getMaxRequiredT05Stage(ch);
  if (includeT05Quests && maxStage > 0) {
    const stages = buildT05Stages(ch).filter(s => s.stage <= maxStage);
    for (const st of stages) {
      for (const ms of st.milestones) {
        if (ms.dungeon && ms.boss) {
          entries.push({
            kind: "t05_quest",
            stage: st.stage,
            milestoneId: ms.id,
            title: ms.title,
            dungeon: ms.dungeon,
            boss: ms.boss,
            done: Boolean(ch.t05.milestones[ms.id]),
            bossRec: getBossRecord(ms.dungeon, ms.boss),
          });
        }
      }
    }
  }

  return entries;
}

function syncT05TabVisibility() {
  const maxStage = getMaxRequiredT05Stage(getActiveChar());
  els.tabT05.classList.toggle("hidden", maxStage === 0);
  if (maxStage === 0 && activeTab === "t05") {
    activeTab = "gear";
  }
}

// ============================================================================
// SHAREABLE GEARSET LINKS (#share=...)
// ============================================================================
function encodeSharePayload(gs, ch = null) {
  const payload = {
    n: gs.name,
    u: gs.bookmarkUrl || "",
    i: gs.items.map(x => [
      x.obtained ? 1 : 0,
      x.slot,
      x.source,
      (x.source === "Dungeon" || x.source === "T0.5") ? x.dungeon : "",
      (x.source === "Dungeon" || x.source === "T0.5") ? x.boss : "",
      x.itemText || "",
      x.source === "T0.5" ? x.t05Status : "",
    ]),
  };
  if (ch) {
    payload.c = ch.name || "";
    payload.f = ch.faction || "Horde";
    const maxStage = getMaxRequiredT05Stage(ch);
    if (maxStage > 0) {
      const quests = [];
      for (const st of buildT05Stages(ch).filter(s => s.stage <= maxStage)) {
        for (const ms of st.milestones) {
          if (ms.dungeon && ms.boss) {
            quests.push([ms.id, st.stage, ms.dungeon, ms.boss, ms.title, ch.t05.milestones[ms.id] ? 1 : 0]);
          }
        }
      }
      if (quests.length) payload.q = quests;
    }
  }
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  let bin = "";
  bytes.forEach(b => (bin += String.fromCharCode(b)));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function decodeSharePayload(encoded) {
  const pad = "=".repeat((4 - (encoded.length % 4)) % 4);
  const b64 = encoded.replace(/-/g, "+").replace(/_/g, "/") + pad;
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const payload = JSON.parse(new TextDecoder().decode(bytes));
  if (!payload || !Array.isArray(payload.i)) throw new Error("Invalid share data");
  const t05Quests = Array.isArray(payload.q)
    ? payload.q.filter(arr => Array.isArray(arr) && arr[2] && arr[3]).map(arr => ({
        milestoneId: String(arr[0] || uid()),
        stage: parseInt(arr[1], 10) || 1,
        dungeon: String(arr[2]),
        boss: String(arr[3]),
        title: String(arr[4] || "T0.5 Quest"),
        done: Boolean(arr[5]),
      }))
    : [];
  return {
    id: uid(),
    name: String(payload.n || "Shared Gearset").trim(),
    charName: String(payload.c || "").trim(),
    faction: payload.f === "Alliance" ? "Alliance" : "Horde",
    bookmarkUrl: String(payload.u || ""),
    items: payload.i.map(arr => normalizeItem({
      id: uid(),
      obtained: Boolean(arr[0]),
      slot: arr[1],
      source: arr[2],
      dungeon: arr[3],
      boss: arr[4],
      itemText: arr[5],
      t05Status: arr[6] || (arr[0] ? "t05" : "need_t0"),
    })),
    t05Quests,
  };
}

function extractShareCode(input) {
  const s = String(input || "").trim();
  if (!s) return "";
  const idx = s.indexOf("#share=");
  if (idx >= 0) return s.slice(idx + "#share=".length).split(/[&\s]/)[0];
  if (s.startsWith("share=")) return s.slice("share=".length).split(/[&\s]/)[0];
  return s.split(/\s/)[0];
}

function upsertPartyMemberFromShare(decoded) {
  const playerName = decoded.charName || decoded.name || "Friend";
  const setName = decoded.name || "Pre-BiS";
  const existing = state.party.members.find(m =>
    m.playerName.toLowerCase() === playerName.toLowerCase() &&
    m.setName.toLowerCase() === setName.toLowerCase()
  );
  const now = new Date().toISOString();
  if (existing) {
    existing.items = decoded.items;
    existing.t05Quests = decoded.t05Quests || [];
    existing.updatedAt = now;
    return { member: existing, updated: true };
  }
  const created = normalizePartyMember({
    id: uid(),
    playerName,
    setName,
    inParty: true,
    updatedAt: now,
    items: decoded.items,
    t05Quests: decoded.t05Quests || [],
  });
  state.party.members.push(created);
  return { member: created, updated: false };
}

function openShareModal(decoded) {
  pendingIncomingShare = decoded;
  const who = decoded.charName ? `${decoded.charName} — ${decoded.name}` : decoded.name;
  const qCount = (decoded.t05Quests || []).length;
  const detail = qCount > 0
    ? `${decoded.items.length} items, ${qCount} T0.5 quest bosses`
    : `${decoded.items.length} items`;
  els.shareModalSummary.innerHTML = `<strong>${esc(who)}</strong> (${esc(detail)})`;
  els.shareModal.classList.remove("hidden");
}

function closeShareModal() {
  pendingIncomingShare = null;
  els.shareModal.classList.add("hidden");
}

function checkIncomingShareHash() {
  const hash = window.location.hash || "";
  if (!hash.startsWith("#share=")) return;
  const code = hash.slice("#share=".length);
  try {
    const imported = decodeSharePayload(code);
    openShareModal(imported);
  } catch (err) {
    console.error(err);
    alert("Could not read the shared gearset link.");
  } finally {
    history.replaceState(null, "", window.location.pathname + window.location.search);
  }
}

async function copyShareLink() {
  const ch = getActiveChar();
  const gs = getActiveSet();
  const code = encodeSharePayload(gs, ch);
  const url = `${window.location.origin}${window.location.pathname}#share=${code}`;
  try {
    await navigator.clipboard.writeText(url);
    showToast(`Copied share link for "${ch.name} — ${gs.name}"`);
  } catch {
    prompt("Copy share link:", url);
  }
}

  const allDungeons = [...fullCatalog.values()].sort((a, b) => a.name.localeCompare(b.name));
  const endgameDungeons = allDungeons.filter(d => d.minLevel >= 50);
  const levelingDungeons = allDungeons.filter(d => d.minLevel < 50);

    `<option value="${esc(s.id)}" ${s.id === gs.id ? "selected" : ""}>${esc(s.name)}</option>`

  const bookmarkValid = isUrl(gs.bookmarkUrl);

  const visibleItems = gs.items.filter(item => {
    if (gearSourceFilter && item.source !== gearSourceFilter) return false;

    return true;
  });

  const rowsHtml = visibleItems.map(item => {
    const canPickBoss = item.source === "Dungeon" || item.source === "T0.5";

// ============================================================================
// TAB 2: AUTO-POPULATED BOSS TO-DO LIST
// ============================================================================
function renderTodoTab() {
  const ch = getActiveChar();
  const maxT05Stage = getMaxRequiredT05Stage(ch);
  const targets = getDerivedTargets(todoScope, showT05QuestBosses);
  const fullCatalog = getDungeonCatalog(false);

  const dungeonGroups = new Map();
  for (const t of targets) {
    if (!dungeonGroups.has(t.dungeon)) dungeonGroups.set(t.dungeon, new Map());
    const bossMap = dungeonGroups.get(t.dungeon);
    if (!bossMap.has(t.boss)) {
      bossMap.set(t.boss, {
        bossName: t.boss,
        bossRec: t.bossRec,
        entries: [],
      });
    }
    bossMap.get(t.boss).entries.push(t);
  }

  const toolbarHtml = `
    <div class="panel" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
      <div class="inline-tools">
        <div class="segmented" role="tablist">
          <button id="scopeActive" class="${todoScope === "active" ? "active" : ""}" type="button">Active Set</button>
          <button id="scopeAll" class="${todoScope === "all" ? "active" : ""}" type="button">All Sets</button>
        </div>
        ${maxT05Stage > 0 ? `
          <label class="chk">
            <input type="checkbox" id="chkShowT05Quests" ${showT05QuestBosses ? "checked" : ""} /> T0.5 quest bosses
          </label>
        ` : ""}
      </div>
      <div class="inline-tools">
        <select id="todoSortSelect" aria-label="Sort dungeons">
          <option value="remaining_desc" ${todoSort === "remaining_desc" ? "selected" : ""}>Most Bosses</option>
          <option value="instance_asc" ${todoSort === "instance_asc" ? "selected" : ""}>Instance (A → Z)</option>
        </select>
        <label class="chk">
          <input type="checkbox" id="chkTodoHideDone" ${todoHideDone ? "checked" : ""} /> Hide completed
        </label>
      </div>
    </div>
  `;

  if (!dungeonGroups.size) {
    els.todoView.innerHTML = toolbarHtml + `
      <div class="empty-state">
        <h3>No dungeon bosses tracked</h3>
        <p style="margin:0 auto 14px;">Assign a Dungeon and Boss in the <strong>Gear Builder</strong> to populate this list.</p>
        <button id="btnGoGearBuilder" class="primary" type="button">Open Gear Builder</button>
      </div>
    `;
    return;
  }

  const cardData = [];
  for (const [dName, bossMap] of dungeonGroups.entries()) {
    const meta = fullCatalog.get(dName);
    let bosses = [...bossMap.values()].sort((a, b) =>
      (a.bossRec?.Boss_Order ?? 999) - (b.bossRec?.Boss_Order ?? 999) || a.bossName.localeCompare(b.bossName)
    );
    const remInInst = bosses.filter(b => b.entries.some(e => !e.done)).length;
    if (todoHideDone) {
      bosses = bosses.filter(b => b.entries.some(e => !e.done));
    }
    if (!bosses.length) continue;
    cardData.push({ name: dName, meta, bosses, remInInst });
  }

  cardData.sort((a, b) => {
    if (todoSort === "remaining_desc") return b.bosses.length - a.bosses.length || a.name.localeCompare(b.name);
    return a.name.localeCompare(b.name);
  });

  if (!cardData.length) {
    els.todoView.innerHTML = toolbarHtml + `
      <div class="empty-state">
        <h3>All bosses completed</h3>
        <p>Uncheck "Hide completed" to review finished targets.</p>
      </div>
    `;
    return;
  }

  const NON_STANDARD_TYPES = new Set(["Summoned", "Rare", "Secret", "Optional", "Event"]);

  const cardsHtml = cardData.map(g => {
    const hasWings = g.bosses.some(b => b.bossRec?.Wing && b.bossRec.Wing !== "Main");

    const rowsHtml = g.bosses.map(b => {
      const allDone = b.entries.every(e => e.done);
      const wing = b.bossRec?.Wing || "";
      const bType = b.bossRec?.Boss_Type || "Main";
      const bossNotes = b.bossRec?.Notes || "";
      const typeTag = NON_STANDARD_TYPES.has(bType)
        ? `<span class="badge type-${esc(bType)}" style="margin-left:6px;vertical-align:middle;">${esc(bType)}</span>`
        : "";

      const dropsHtml = b.entries.map(e => {
        if (e.kind === "t05_quest") {
          return `
            <div class="drop-chip ${e.done ? "done" : ""}">
              <input type="checkbox" data-todo-t05-ms="${esc(e.milestoneId)}" ${e.done ? "checked" : ""} />
              <div class="drop-chip-body">
                <span class="t05-quest-tag">T0.5 S${e.stage}</span>
                <span style="color:var(--text)">${esc(e.title)}</span>
              </div>
            </div>
          `;
        }
        const label = shortLabelForItem(e.item.itemText);
        const link = isUrl(e.item.itemText);
        const isT05 = e.item.source === "T0.5";
        return `
          <div class="drop-chip ${e.done ? "done" : ""}">
            <input type="checkbox" data-todo-item-id="${esc(e.item.id)}" data-todo-set-id="${esc(e.gearsetId)}" ${e.done ? "checked" : ""} />
            <div class="drop-chip-body">
              <span class="slot-tag">${esc(e.item.slot)}</span>
              ${isT05 ? `<span class="base-t0-tag">${e.item.t05Status === "t05" ? "T0.5 ✓" : "Base T0"}</span>` : ""}
              ${todoScope === "all" ? `<span class="set-tag">${esc(e.gearsetName)}</span>` : ""}
              ${link
                ? `<a href="${esc(e.item.itemText.trim())}" target="_blank" rel="noopener noreferrer" style="color:var(--forever-text);text-decoration:none;">${esc(label)} ↗</a>`
                : (label ? `<span style="color:var(--text)">${esc(label)}</span>` : "")
              }
            </div>
          </div>
        `;
      }).join("");

      return `
        <tr class="${allDone ? "row-obtained" : ""}">
          <td class="boss-name">${esc(b.bossName)}${typeTag}</td>
          ${hasWings ? `<td style="color:var(--muted)">${esc(wing)}</td>` : ""}
          <td class="notes-cell">${esc(bossNotes)}</td>
          <td><div class="todo-drops">${dropsHtml}</div></td>
        </tr>
      `;
    }).join("");

    return `
      <section class="instance-card open ${g.remInInst > 0 ? "has-active" : ""}">
        <div class="instance-header static">
          <div class="inst-left">
            <span class="inst-name">${esc(g.name)}</span>
          </div>
        </div>
        <div class="instance-body">
          <div class="table-wrap">
            <table class="todo-table">
              <colgroup>
                <col style="width:240px" />
                ${hasWings ? `<col style="width:155px" />` : ""}
                <col />
                <col style="width:360px" />
              </colgroup>
              <thead>
                <tr>
                  <th>Boss</th>
                  ${hasWings ? `<th>Wing</th>` : ""}
                  <th>Notes</th>
                  <th>Targets</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>
      </section>
    `;
  }).join("");

  els.todoView.innerHTML = toolbarHtml + cardsHtml;
}

    els.t05View.innerHTML = `<div class="empty-state"><h3>No T0.5 pieces in gearsets</h3></div>`;
    return;
  }

  const allT05Items = getCharacterT05Items(ch);
  const trackedSlots = new Set(allT05Items.map(x => x.item.slot));
  const stages = buildT05Stages(ch);
  const visibleStages = ch.t05.showAllStages ? stages : stages.filter(s => s.stage <= maxStage);

  const toolbarHtml = `
    <div class="panel" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;">
      <div class="inline-tools">
        ${maxStage < 4 ? `
          <label class="chk">
            <input type="checkbox" id="chkT05ShowAll" ${ch.t05.showAllStages ? "checked" : ""} /> Show all 4 stages
          </label>
        ` : `<strong style="color:var(--text-strong);font-size:0.88rem;">T0.5 Questline</strong>`}
      </div>
      <div class="inline-tools">
        <a class="link-btn" href="${T05_GUIDE_URL}" target="_blank" rel="noopener noreferrer">Wowhead Guide ↗</a>

  const cardsHtml = visibleStages.map(st => {
    const stageComplete = st.milestones.every(m => ch.t05.milestones[m.id]);
    const hasTargetSlot = st.slots.some(sl => trackedSlots.has(sl));
    const roleTag = st.stage > maxStage
      ? `<span class="badge muted-badge">Optional</span>`

    const stageGearItems = allT05Items.filter(x => st.slots.includes(x.item.slot));
    const upgradableCount = stageGearItems.filter(x => x.item.t05Status !== "t05").length;

    const piecesHtml = st.slots.map(slot => {
      const matching = allT05Items.filter(x => x.item.slot === slot);

        const allUpgraded = matching.every(x => x.item.t05Status === "t05");

        const cls = allUpgraded ? "upgraded" : (allHaveT0 ? "ready" : "");
        const statusTxt = allUpgraded ? "T0.5 ✓" : (allHaveT0 ? "Have T0" : "Need T0");
        return `
          <span class="t05-piece-chip ${cls}">
            <strong>${esc(slot)}</strong>
            <span style="font-size:11px;color:${allUpgraded ? "var(--success)" : (allHaveT0 ? "var(--forever-text)" : "var(--muted)")}">${statusTxt}</span>
          </span>
        `;
      } else {
        const owned = Boolean(ch.t05.prereqT0Owned[slot]);
        return `
          <label class="t05-piece-chip ${owned ? "ready" : ""}" style="cursor:pointer;">
            <input type="checkbox" data-t05-prereq="${esc(slot)}" ${owned ? "checked" : ""} />

    const amuletHtml = st.hasAmuletPickers ? `

          <label for="selComp1">1. Components of Importance</label>
          <select id="selComp1">
            ${T05_AMULET_BRANCHES.map(b => `<option value="${esc(b.id)}" ${ch.t05.componentsFirst === b.id ? "selected" : ""}>${esc(b.componentLabel)}</option>`).join("")}
          </select>
        </div>
        <div class="t05-amulet-picker">
          <label for="selLeftAmulet">2. Left Piece Boss</label>
          <select id="selLeftAmulet">
            ${T05_AMULET_BRANCHES.map(b => `<option value="${esc(b.boss)}" ${ch.t05.leftAmuletBoss === b.boss ? "selected" : ""}>${esc(b.bossLabel)}</option>`).join("")}
          </select>
        </div>
        <div class="t05-amulet-picker">
          <label for="selComp2">3. More Components of Importance</label>
          <select id="selComp2">
            ${T05_AMULET_BRANCHES.map(b => `<option value="${esc(b.id)}" ${ch.t05.componentsSecond === b.id ? "selected" : ""}>${esc(b.componentLabel)}</option>`).join("")}
          </select>
        </div>
        <div class="t05-amulet-picker">
          <label for="selRightAmulet">4. Right Piece Boss</label>
          <select id="selRightAmulet">
            ${T05_AMULET_BRANCHES.map(b => `<option value="${esc(b.boss)}" ${ch.t05.rightAmuletBoss === b.boss ? "selected" : ""}>${esc(b.bossLabel)}</option>`).join("")}
          </select>
        </div>
      </div>

    const milestonesHtml = st.milestones.map(ms => {
      const done = Boolean(ch.t05.milestones[ms.id]);

        <label class="t05-milestone-row ${done ? "done" : ""}" style="cursor:pointer;">

    return `
      <section class="instance-card open ${stageComplete ? "" : "has-active"}">
        <div class="instance-header static">

  els.t05View.innerHTML = toolbarHtml + cardsHtml;

// ============================================================================
// TAB 4: PARTY PLANNER (MULTI-PLAYER OVERLAP & IN-RUN CHECKOFFS)
// ============================================================================
function getActivePartyPlayers() {
  const players = [];
  const ch = getActiveChar();
  if (state.party.includeSelf) {
    players.push({ key: "self", label: ch.name || "You", isSelf: true });
  }
  for (const m of state.party.members) {
    if (m.inParty) {
      players.push({ key: m.id, label: m.playerName, isSelf: false, member: m });
    }
  }
  return players;
}

function getPartyEntries(includeT05 = true) {
  const ch = getActiveChar();
  const entries = [];

  if (state.party.includeSelf) {
    const selfTargets = getDerivedTargets(state.party.selfScope, includeT05);
    for (const t of selfTargets) {
      entries.push({
        ...t,
        playerKey: "self",
        playerLabel: ch.name || "You",
        isSelf: true,
      });
    }
  }

  for (const m of state.party.members) {
    if (!m.inParty) continue;
    for (const item of m.items) {
      if ((item.source === "Dungeon" || item.source === "T0.5") && item.dungeon && item.boss) {
        entries.push({
          kind: "item",
          memberId: m.id,
          playerKey: m.id,
          playerLabel: m.playerName,
          isSelf: false,
          dungeon: item.dungeon,
          boss: item.boss,
          done: isItemDoneForBossTodo(item),
          item,
          bossRec: getBossRecord(item.dungeon, item.boss),
        });
      }
    }
    if (includeT05) {
      for (const q of m.t05Quests || []) {
        if (q.dungeon && q.boss) {
          entries.push({
            kind: "t05_quest",
            memberId: m.id,
            playerKey: m.id,
            playerLabel: m.playerName,
            isSelf: false,
            stage: q.stage,
            milestoneId: q.milestoneId,
            title: q.title,
            dungeon: q.dungeon,
            boss: q.boss,
            done: Boolean(q.done),
            bossRec: getBossRecord(q.dungeon, q.boss),
          });
        }
      }
    }
  }

  return entries;
}

function analyzeBossOverlaps(entries) {
  const active = entries.filter(e => !e.done);
  const contested = [];
  const slotOverlaps = [];
  let sharedT05 = false;

  // 1. Shared T0.5 quest synergy (2+ distinct players)
  const t05Players = new Set(active.filter(e => e.kind === "t05_quest").map(e => e.playerKey));
  if (t05Players.size >= 2) sharedT05 = true;

  // 2. Exact contested drops (same Wowhead item ID, or identical non-URL text)
  const activeDrops = active.filter(e => e.kind === "item");
  const byItemKey = new Map();
  for (const e of activeDrops) {
    const whId = extractWowheadItemId(e.item.itemText);
    let key = "";
    let label = "";
    if (whId) {
      key = `wh:${whId}`;
      label = shortLabelForItem(e.item.itemText);
    } else {
      const txt = String(e.item.itemText || "").trim();
      if (txt && !isUrl(txt)) {
        key = `txt:${txt.toLowerCase().replace(/\s+/g, " ")}`;
        label = txt;
      }
    }
    if (!key) continue;
    if (!byItemKey.has(key)) byItemKey.set(key, { label, players: new Set(), slots: new Set() });
    const g = byItemKey.get(key);
    g.players.add(e.playerKey);
    g.slots.add(e.item.slot);
  }

  const contestedSlotsCovered = new Map();
  for (const g of byItemKey.values()) {
    if (g.players.size >= 2) {
      contested.push(g.label);
      for (const sl of g.slots) {
        if (!contestedSlotsCovered.has(sl)) contestedSlotsCovered.set(sl, new Set());
        for (const p of g.players) contestedSlotsCovered.get(sl).add(p);
      }
    }
  }

  // 3. Slot overlap (2+ distinct players want same slot without distinct Wowhead IDs)
  const bySlot = new Map();
  for (const e of activeDrops) {
    const sl = e.item.slot;
    if (!bySlot.has(sl)) bySlot.set(sl, []);
    bySlot.get(sl).push(e);
  }

  for (const [slot, list] of bySlot.entries()) {
    const distinctPlayers = new Set(list.map(e => e.playerKey));
    if (distinctPlayers.size < 2) continue;

    // Skip if every player in this slot already matched exact Contested
    const covered = contestedSlotsCovered.get(slot);
    if (covered && [...distinctPlayers].every(p => covered.has(p))) continue;

    // If EVERY entry has a Wowhead item ID and NO two distinct players share an ID,
    // they are explicitly farming different items from the same boss -> no false overlap.
    const allHaveWhId = list.every(e => Boolean(extractWowheadItemId(e.item.itemText)));
    if (allHaveWhId) {
      const idPlayers = new Map();
      let sharedId = false;
      for (const e of list) {
        const id = extractWowheadItemId(e.item.itemText);
        if (!idPlayers.has(id)) idPlayers.set(id, new Set());
        idPlayers.get(id).add(e.playerKey);
        if (idPlayers.get(id).size >= 2) sharedId = true;
      }
      if (!sharedId) continue;
    }

    slotOverlaps.push(slot);
  }

  return { contested, slotOverlaps, sharedT05 };
}

function buildPartyDungeonCards() {
  const entries = getPartyEntries(partyShowT05);
  const dungeonGroups = new Map();

  for (const e of entries) {
    if (!dungeonGroups.has(e.dungeon)) dungeonGroups.set(e.dungeon, new Map());
    const bossMap = dungeonGroups.get(e.dungeon);
    if (!bossMap.has(e.boss)) {
      bossMap.set(e.boss, {
        bossName: e.boss,
        bossRec: e.bossRec,
        entries: [],
      });
    }
    bossMap.get(e.boss).entries.push(e);
  }

  const cards = [];
  for (const [dName, bossMap] of dungeonGroups.entries()) {
    let bosses = [...bossMap.values()].sort((a, b) =>
      (a.bossRec?.Boss_Order ?? 999) - (b.bossRec?.Boss_Order ?? 999) || a.bossName.localeCompare(b.bossName)
    );

    const remBosses = bosses.filter(b => b.entries.some(e => !e.done));
    if (partyHideDone) {
      bosses = remBosses;
    }
    if (!bosses.length) continue;

    const visiblePlayers = new Set();
    let visibleNeeds = 0;
    let contestedCount = 0;
    let sharedT05Count = 0;

    for (const b of bosses) {
      b.overlaps = analyzeBossOverlaps(b.entries);
      contestedCount += b.overlaps.contested.length;
      if (b.overlaps.sharedT05) sharedT05Count++;
      const countedEntries = partyHideDone ? b.entries.filter(e => !e.done) : b.entries;
      for (const e of countedEntries) {
        visiblePlayers.add(e.playerKey);
        visibleNeeds++;
      }
    }

    if (partyOverlapOnly && visiblePlayers.size < 2) continue;

    cards.push({
      name: dName,
      bosses,
      remCount: remBosses.length,
      playerCount: visiblePlayers.size,
      needCount: visibleNeeds,
      contestedCount,
      sharedT05Count,
    });
  }

  cards.sort((a, b) => {
    if (partySort === "players_desc") {
      return b.playerCount - a.playerCount || b.needCount - a.needCount || b.bosses.length - a.bosses.length || a.name.localeCompare(b.name);
    }
    if (partySort === "needs_desc") {
      return b.needCount - a.needCount || b.playerCount - a.playerCount || a.name.localeCompare(b.name);
    }
    if (partySort === "bosses_desc") {
      return b.bosses.length - a.bosses.length || b.playerCount - a.playerCount || a.name.localeCompare(b.name);
    }
    if (partySort === "conflict_asc") {
      return a.contestedCount - b.contestedCount || b.playerCount - a.playerCount || b.needCount - a.needCount || a.name.localeCompare(b.name);
    }
    return a.name.localeCompare(b.name);
  });

  return cards;
}

function formatDiscordDungeonPlan(card, activeTotal) {
  const lines = [`**${card.name}** (${card.playerCount}/${activeTotal} players)`];
  for (const b of card.bosses) {
    const activeEntries = b.entries.filter(e => !e.done);
    if (!activeEntries.length) continue;
    const tags = [];
    if (b.overlaps.contested.length) tags.push(`Contested: ${b.overlaps.contested.join(", ")}`);
    if (b.overlaps.sharedT05) tags.push("Shared T0.5");
    const suffix = tags.length ? ` [${tags.join(" | ")}]` : "";
    const who = activeEntries.map(e => {
      if (e.kind === "t05_quest") return `${e.playerLabel} (T0.5 S${e.stage})`;
      const itemLabel = shortLabelForItem(e.item.itemText);
      return itemLabel ? `${e.playerLabel} (${e.item.slot}: ${itemLabel})` : `${e.playerLabel} (${e.item.slot})`;
    }).join(", ");
    lines.push(`- **${b.bossName}**${suffix} — ${who}`);
  }
  return lines.join("\n");
}

function populateInstanceDropdown() {
  const current = els.instance.value;
  const catalog = getDungeonCatalog(endgameOnly);
  const sorted = [...catalog.values()].sort((a, b) => a.name.localeCompare(b.name));
  let html = `<option value="">All ${endgameOnly ? "Endgame " : ""}Instances</option>`;
  html += sorted.map(d => `<option value="${esc(d.name)}">${esc(d.name)}</option>`).join("");
  els.instance.innerHTML = html;
  els.instance.value = catalog.has(current) ? current : "";
}

function getFilteredCompendiumRows() {
  const q = els.search.value.trim().toLowerCase();
  const inst = els.instance.value;
  const type = els.type.value;
  const coreOnly = els.coreOnly.checked;

  return allBosses.filter(r => {
    if (endgameOnly && !isEndgame(r)) return false;
    if (inst && r.Instance !== inst) return false;
    if (type && r.Boss_Type !== type) return false;
    if (coreOnly && r.Boss_Type !== "Main" && r.Boss_Type !== "Final") return false;
    if (q) {
      const hay = `${r.Instance} ${r.Wing} ${r.Boss_Name} ${r.Boss_Type} ${r.Notes}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function getBossTargetCounts() {
  const map = new Map();
  for (const t of getDerivedTargets("all", true)) {
    const k = `${t.dungeon}||${t.boss}`;
    if (!map.has(k)) map.set(k, { total: 0, remaining: 0 });
    const obj = map.get(k);
    obj.total++;
    if (!t.done) obj.remaining++;
  }
  return map;
}

function renderCompendiumInstanceTable(bosses, targetCounts) {
  const rowsHtml = bosses.map(r => {

function renderCompendiumTab() {
  const filtered = getFilteredCompendiumRows();
  const targetCounts = getBossTargetCounts();

  els.expandAll.classList.toggle("hidden", viewMode !== "grouped");
  els.collapseAll.classList.toggle("hidden", viewMode !== "grouped");

  if (!filtered.length) {
    els.compendiumView.innerHTML = `<div class="empty-state"><h3>No matching bosses</h3></div>`;
    return;
  }

  if (viewMode === "grouped") {
    const groups = new Map();
    for (const r of filtered) {
      if (!groups.has(r.Instance)) groups.set(r.Instance, []);
      groups.get(r.Instance).push(r);
    }
    const groupArr = [...groups.entries()].map(([name, bosses]) => {
      bosses.sort((a, b) => a.Boss_Order - b.Boss_Order);
      return { name, bosses, minLevel: bosses[0].Min_Level, maxLevel: bosses[0].Max_Level, levelRange: bosses[0].Level_Range };
    });
    const sortMode = els.sort.value;
    groupArr.sort((a, b) => {
      if (sortMode === "instance_asc") return a.name.localeCompare(b.name);
      if (sortMode === "instance_desc") return b.name.localeCompare(a.name);
      if (sortMode === "level_asc") return a.minLevel - b.minLevel || a.maxLevel - b.maxLevel || a.name.localeCompare(b.name);
      if (sortMode === "level_desc") return b.maxLevel - a.maxLevel || b.minLevel - a.minLevel || a.name.localeCompare(b.name);
      return 0;
    });

    const autoOpen = Boolean(els.search.value.trim() || els.instance.value);
    els.compendiumView.innerHTML = groupArr.map(g => {
      const isOpen = autoOpen || openInstances.has(g.name);
      const wings = [...new Set(g.bosses.map(b => b.Wing))];
      const hasMultipleWings = wings.length > 1 || (wings.length === 1 && wings[0] !== "Main");
      const hasNeeded = g.bosses.some(b => (targetCounts.get(`${b.Instance}||${b.Boss_Name}`)?.remaining || 0) > 0);

      let bodyHtml = "";
      if (hasMultipleWings) {
        for (const w of wings) {
          const wBosses = g.bosses.filter(b => b.Wing === w);
          bodyHtml += `<div class="wing-banner">${esc(w)}</div>`;
          bodyHtml += renderCompendiumInstanceTable(wBosses, targetCounts);
        }
      } else {
        bodyHtml = renderCompendiumInstanceTable(g.bosses, targetCounts);
      }

      return `
        <section class="instance-card ${hasNeeded ? "has-active" : ""} ${isOpen ? "open" : ""}">
          <button type="button" class="instance-header" data-toggle="${esc(g.name)}">
            <div class="inst-left">
              <span class="chevron">▶</span>
              <span class="inst-name">${esc(g.name)}</span>
              ${hasNeeded ? `<span class="badge accent-badge">To-Do</span>` : ""}
            </div>
            <div class="inst-meta">Lv. ${esc(g.levelRange)}</div>
          </button>
          <div class="instance-body">${bodyHtml}</div>
        </section>
      `;
    }).join("");
  } else {
    const sorted = filtered.slice().sort((a, b) => {
      const { col, dir } = tableSort;
      let cmp = col === "Min_Level" ? (a[col] - b[col]) : String(a[col]).localeCompare(String(b[col]));
      if (cmp === 0) cmp = a.Instance.localeCompare(b.Instance) || a.Boss_Order - b.Boss_Order;
      return dir === "asc" ? cmp : -cmp;
    });

    const cols = [
      ["Instance", "Instance"], ["Min_Level", "Level"], ["Wing", "Wing"],
      ["Boss_Name", "Boss"], ["Boss_Type", "Type"], ["Notes", "Notes"]
    ];
    const thHtml = cols.map(([k, l]) => {
      const active = tableSort.col === k;
      return `<th class="sortable ${active ? "sorted" : ""}" data-sort-col="${k}">${l}${active ? (tableSort.dir === "asc" ? " ▲" : " ▼") : ""}</th>`;
    }).join("");

    const bodyHtml = sorted.map(r => {
      const tc = targetCounts.get(`${r.Instance}||${r.Boss_Name}`);
      const badge = tc ? (tc.remaining > 0 ? `<span class="badge accent-badge" style="margin-left:6px;">To-Do</span>` : `<span class="badge done-tag" style="margin-left:6px;">✓</span>`) : "";
      return `
        <tr class="${tc && tc.remaining > 0 ? "row-targeted" : ""}">
          <td><strong>${esc(r.Instance)}</strong></td>
          <td style="color:var(--muted);white-space:nowrap">${esc(r.Level_Range)}</td>
          <td style="color:var(--muted)">${r.Wing === "Main" ? "" : esc(r.Wing)}</td>
          <td class="boss-name">${esc(r.Boss_Name)}${badge}</td>
          <td><span class="badge type-${esc(r.Boss_Type)}">${esc(r.Boss_Type)}</span></td>
          <td class="notes-cell">${esc(r.Notes)}</td>
        </tr>
      `;
    }).join("");

    els.compendiumView.innerHTML = `<div class="table-wrap"><table><thead><tr>${thHtml}</tr></thead><tbody>${bodyHtml}</tbody></table></div>`;
  }
}

function parseCsvRows(text) {
  const rows = [];
  let row = [], cell = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (inQuotes) {
      if (ch === '"' && next === '"') { cell += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { cell += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { row.push(cell); cell = ""; }
      else if (ch === '\r' && next === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; i++; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; }
      else { cell += ch; }
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function parseBossCsv(text) {
  const rows = parseCsvRows(text);
  const header = (rows.shift() || []).map(h => h.trim().replace(/^\uFEFF/, ""));
  return rows.filter(r => r.length >= header.length && r.some(c => c.trim())).map(r => {
    const obj = {};
    header.forEach((h, idx) => obj[h] = (r[idx] ?? "").trim());
    obj.Boss_Order = parseInt(obj.Boss_Order, 10) || 0;
    const parts = String(obj.Level_Range || "0").replace("–", "-").split("-");
    obj.Min_Level = parseInt(parts[0], 10) || 0;
    obj.Max_Level = parseInt(parts[1] || parts[0], 10) || 0;
    return obj;
  });
}

    "dmw": "Dire Maul: West",
    "dm north": "Dire Maul: North",

    "st": "The Temple of Atal'Hakkar (Sunken Temple)",
    "sunken temple": "The Temple of Atal'Hakkar (Sunken Temple)",
    "zf": "Zul'Farrak",
    "rfc": "Ragefire Chasm",
    "wc": "Wailing Caverns",
    "sfk": "Shadowfang Keep",
    "bfd": "Blackfathom Deeps",
    "rfk": "Razorfen Kraul",
    "rfd": "Razorfen Downs",
    "sm": "Scarlet Monastery",
  };

  const allInstNames = [...new Set(allBosses.map(b => b.Instance))];
  let dungeon = aliases[dRaw.toLowerCase()] ||
    allInstNames.find(n => n.toLowerCase() === dRaw.toLowerCase()) ||
    allInstNames.find(n => n.toLowerCase().includes(dRaw.toLowerCase())) || "";

  let boss = "";
  if (dungeon && bRaw) {
    const candidates = allBosses.filter(b => b.Instance === dungeon);
    const exact = candidates.find(b => b.Boss_Name.toLowerCase() === bRaw.toLowerCase());
    const partial = candidates.find(b => b.Boss_Name.toLowerCase().includes(bRaw.toLowerCase()));
    boss = (exact || partial)?.Boss_Name || "";
  }
  return { dungeon, boss };
}

function importGearCsv(text, filename) {
  const rawRows = parseCsvRows(text);
  if (rawRows.length < 2) return;
  const header = rawRows[0].map(h => h.trim().replace(/^\uFEFF/, "").toLowerCase());
  const idxObt = header.findIndex(h => h === "" || h === "obtained" || h === "got" || h === "done" || h === "status");
  const idxT05 = header.indexOf("t05_status");
  const idxSlot = header.indexOf("slot");
  const idxDung = header.indexOf("dungeon");
  const idxBoss = header.indexOf("boss");
  const idxSrc = header.indexOf("source");
  const idxItem = header.findIndex(h => h === "item" || h === "link" || h === "item / link");

  const items = [];
  for (let i = 1; i < rawRows.length; i++) {
    const r = rawRows[i];
    const slotRaw = (r[idxSlot] || "").trim();
    const srcRaw = (r[idxSrc] || "").trim();
    const itemRaw = (r[idxItem] || "").trim();
    if (!slotRaw && !srcRaw && !itemRaw) continue;

    const slot = SLOTS.find(s => s.toLowerCase() === slotRaw.toLowerCase()) || "Head";
    const source = SOURCES.find(s => s.toLowerCase() === srcRaw.toLowerCase()) || "Dungeon";
    const obtained = String(r[idxObt] || "").trim().toUpperCase() === "TRUE" || String(r[idxObt] || "").trim().toLowerCase() === "yes";
    const t05Status = idxT05 >= 0 && r[idxT05] ? r[idxT05].trim() : (obtained ? "t05" : "need_t0");
    const resolved = (source === "Dungeon" || source === "T0.5") ? resolveDungeonAndBoss(r[idxDung], r[idxBoss]) : { dungeon: "", boss: "" };

    items.push(normalizeItem({
      id: uid(),
      obtained,
      t05Status,
      slot,
      source,
      dungeon: resolved.dungeon,
      boss: resolved.boss,
      itemText: itemRaw,
    }));
  }

  if (!items.length) {
    alert("No valid gear rows found in CSV.");
    return;
  }

  const ch = getActiveChar();
  const setName = filename.replace(/\.csv$/i, "").trim() || `Imported Set ${ch.gearsets.length + 1}`;
  const newSet = { id: uid(), name: setName, bookmarkUrl: "", items };
  ch.gearsets.push(newSet);
  ch.activeSetId = newSet.id;
  saveState();
  render();
  showToast(`Imported "${setName}"`);
}

function downloadBlob(content, mime, filename) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportCsv() {
  const csvCell = v => {
    const s = String(v ?? "");
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const ch = getActiveChar();
  let cols, dataRows, filename;

  if (activeTab === "gear") {
    const gs = getActiveSet();
    cols = ["Obtained", "T05_Status", "Slot", "Dungeon", "Boss", "Source", "Item"];
    dataRows = gs.items.map(i => ({
      Obtained: i.obtained ? "TRUE" : "FALSE",
      T05_Status: i.source === "T0.5" ? i.t05Status : "",
      Slot: i.slot,
      Dungeon: (i.source === "Dungeon" || i.source === "T0.5") ? i.dungeon : "",
      Boss: (i.source === "Dungeon" || i.source === "T0.5") ? i.boss : "",
      Source: i.source,
      Item: i.itemText,
    }));
    filename = `${ch.name}_${gs.name}_gear.csv`.toLowerCase().replace(/[^a-z0-9_.]+/g, "_");
  } else if (activeTab === "todo") {
    cols = ["Character", "Kind", "Gearset_or_Stage", "Instance", "Wing", "Boss_Order", "Boss_Name", "Boss_Type", "Boss_Notes", "Slot", "Done", "Item_or_Quest"];
    dataRows = getDerivedTargets(todoScope, showT05QuestBosses).map(t => ({
      Character: ch.name,
      Kind: t.kind === "t05_quest" ? "T0.5 Quest" : (t.item.source === "T0.5" ? "Base T0" : "Gear Drop"),
      Gearset_or_Stage: t.kind === "t05_quest" ? `Stage ${t.stage}` : t.gearsetName,
      Instance: t.dungeon,
      Wing: t.bossRec?.Wing || "Main",
      Boss_Order: t.bossRec?.Boss_Order ?? "",
      Boss_Name: t.boss,
      Boss_Type: t.bossRec?.Boss_Type || "",
      Boss_Notes: t.bossRec?.Notes || "",
      Slot: t.kind === "t05_quest" ? "T0.5" : t.item.slot,
      Done: t.done ? "TRUE" : "FALSE",
      Item_or_Quest: t.kind === "t05_quest" ? t.title : t.item.itemText,
    }));
    filename = `${ch.name}_boss_todo.csv`.toLowerCase().replace(/[^a-z0-9_.]+/g, "_");
  } else if (activeTab === "t05") {
    const maxStage = getMaxRequiredT05Stage(ch);
    const stages = buildT05Stages(ch).filter(s => ch.t05.showAllStages || s.stage <= maxStage);
    cols = ["Character", "Faction", "Stage", "Milestone", "Dungeon", "Boss", "Completed"];
    dataRows = stages.flatMap(st => st.milestones.map(ms => ({
      Character: ch.name,
      Faction: ch.faction,
      Stage: st.stage,
      Milestone: ms.title,
      Dungeon: ms.dungeon || "",
      Boss: ms.boss || "",
      Completed: ch.t05.milestones[ms.id] ? "TRUE" : "FALSE",
    })));
    filename = `${ch.name}_t05_chain.csv`.toLowerCase().replace(/[^a-z0-9_.]+/g, "_");
  } else if (activeTab === "party") {
    cols = ["Instance", "Wing", "Boss_Order", "Boss_Name", "Player", "Kind", "Slot", "Done", "Overlap", "Item_or_Quest"];
    dataRows = [];
    for (const card of buildPartyDungeonCards()) {
      for (const b of card.bosses) {
        const ov = [];
        if (b.overlaps.contested.length) ov.push(`Contested: ${b.overlaps.contested.join("; ")}`);
        if (b.overlaps.slotOverlaps.length) ov.push(`Slot Overlap: ${b.overlaps.slotOverlaps.join("; ")}`);
        if (b.overlaps.sharedT05) ov.push("Shared T0.5");
        const ovStr = ov.join(" | ");
        for (const e of b.entries) {
          dataRows.push({
            Instance: card.name,
            Wing: b.bossRec?.Wing || "Main",
            Boss_Order: b.bossRec?.Boss_Order ?? "",
            Boss_Name: b.bossName,
            Player: e.isSelf ? ch.name : e.playerLabel,
            Kind: e.kind === "t05_quest" ? `T0.5 S${e.stage}` : (e.item.source === "T0.5" ? "Base T0" : "Gear Drop"),
            Slot: e.kind === "t05_quest" ? "T0.5" : e.item.slot,
            Done: e.done ? "TRUE" : "FALSE",
            Overlap: ovStr,
            Item_or_Quest: e.kind === "t05_quest" ? e.title : e.item.itemText,
          });
        }
      }
    }
    filename = "party_dungeon_plan.csv";
  } else {
    cols = ["Instance","Wing","Boss_Order","Boss_Name","Boss_Type","Origin","Zone","Continent","Level_Range","Verification_Sources","Notes"];
    dataRows = getFilteredCompendiumRows();
    filename = "dungeon_bosses_filtered.csv";
  }

  const lines = [cols.join(",")].concat(dataRows.map(r => cols.map(c => csvCell(r[c])).join(",")));
  downloadBlob(lines.join("\r\n"), "text/csv;charset=utf-8;", filename);
}

function backupJson() {
  const payload = JSON.stringify(state, null, 2);
  const stamp = new Date().toISOString().slice(0, 10);
  downloadBlob(payload, "application/json;charset=utf-8;", `dungeon_todo_backup_${stamp}.json`);
  showToast("Backup downloaded");
}

function restoreJson(text) {
  try {
    const parsed = JSON.parse(text);
    const isV2 = parsed && parsed.version === 2 && Array.isArray(parsed.characters) && parsed.characters.length;
    const isV1 = parsed && Array.isArray(parsed.gearsets) && parsed.gearsets.length;
    if (!isV2 && !isV1) throw new Error("Invalid backup");

    const msg = isV2
      ? `Restore ${parsed.characters.length} character(s)? This replaces your current saved data.`
      : `Restore v1 backup (${parsed.gearsets.length} gearset(s))? This replaces your current saved data.`;
    if (!confirm(msg)) return;

    state = migrateToV2(parsed);
    saveState();
    render();
    showToast("Backup restored");
  } catch {
    alert("Invalid backup JSON file.");
  }
}
